<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruhini - Seller Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        amber: { 50: '#fffbeb', 600: '#d97706', 700: '#b45309', 900: '#78350f' },
                        royalDark: '#0f0805',
                        glass: 'rgba(255, 255, 255, 0.05)'
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="js/config.js"></script>
</head>

<body class="bg-royalDark text-amber-50 font-sans antialiased min-h-screen">

    <script>
        const role = localStorage.getItem('userRole');
        const token = localStorage.getItem('authToken');
        if (!token || role !== 'SELLER') {
            window.location.href = 'login.html';
        }
    </script>

    <nav
        class="fixed top-0 w-full z-50 bg-royalDark/95 border-b border-white/10 px-6 py-4 flex justify-between items-center backdrop-blur-md">
        <div class="flex items-center gap-4">
            <a href="index.html" class="font-cinzel text-xl font-bold text-amber-500 tracking-widest">GRUHINI</a>
            <span class="text-xs bg-amber-900/50 px-2 py-1 rounded border border-amber-700/50 text-amber-200">SELLER
                HUB</span>
        </div>
        <div class="flex items-center gap-4">
            <span id="shopNameDisplay"
                class="hidden md:block text-sm font-bold text-gray-400 uppercase tracking-wider">My Kitchen</span>
            <button onclick="logout()"
                class="text-xs text-red-400 hover:text-red-300 font-bold uppercase tracking-widest">Logout</button>
        </div>
    </nav>

    <div class="pt-28 pb-12 px-4 max-w-6xl mx-auto">

        <div class="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">
            <div>
                <h1 class="font-cinzel text-3xl md:text-4xl text-white mb-2">Manage Kitchen</h1>
                <p class="text-gray-400 text-sm">Add new dishes, manage stock, and view orders.</p>
            </div>
            <button onclick="openModal()"
                class="bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white px-8 py-3 rounded-full font-bold text-sm tracking-widest uppercase shadow-lg shadow-amber-900/50 transition-all transform hover:-translate-y-1">
                + Add New Dish
            </button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
            <div class="bg-glass border border-white/5 p-6 rounded-2xl">
                <h3 class="text-gray-400 text-xs uppercase tracking-widest mb-2">Total Orders</h3>
                <p class="text-2xl font-cinzel text-white">124</p>
            </div>
            <div class="bg-glass border border-white/5 p-6 rounded-2xl">
                <h3 class="text-gray-400 text-xs uppercase tracking-widest mb-2">Revenue</h3>
                <p class="text-2xl font-cinzel text-amber-400">₹18.5k</p>
            </div>
            <div class="bg-glass border border-white/5 p-6 rounded-2xl">
                <h3 class="text-gray-400 text-xs uppercase tracking-widest mb-2">Rating</h3>
                <p class="text-2xl font-cinzel text-white">4.8 ⭐</p>
            </div>
            <div class="bg-glass border border-white/5 p-6 rounded-2xl">
                <h3 class="text-gray-400 text-xs uppercase tracking-widest mb-2">Active Dishes</h3>
                <p class="text-2xl font-cinzel text-green-400">8</p>
            </div>
        </div>

        <div
            class="bg-glass border border-white/5 rounded-3xl p-8 min-h-[300px] flex flex-col items-center justify-center text-center">
            <div class="text-4xl mb-4">🍲</div>
            <h3 class="font-cinzel text-xl text-gray-300 mb-2">Your Menu is Live</h3>
            <p class="text-gray-500 text-sm max-w-md">Dishes you add will appear here. Use the button above to add your
                first dish for today.</p>
        </div>

    </div>

    <div id="productModal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeModal()"></div>

        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-2xl bg-[#1a0f0a] border border-amber-900/30 rounded-3xl shadow-2xl p-8 max-h-[90vh] overflow-y-auto custom-scrollbar">

            <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
                <h2 class="font-cinzel text-2xl text-amber-500">Add New Dish</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl">&times;</button>
            </div>

            <form onsubmit="handleAddProduct(event)" class="space-y-6">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Dish
                            Name</label>
                        <input type="text" name="name" required
                            class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none transition-colors"
                            placeholder="e.g. Masala Chips">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Price
                            (₹)</label>
                        <input type="number" name="price" required
                            class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none transition-colors"
                            placeholder="150">
                    </div>
                </div>

                <div>
                    <label
                        class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Description</label>
                    <textarea name="description" required rows="3"
                        class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none transition-colors"
                        placeholder="Describe the taste, ingredients..."></textarea>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div>
                        <label
                            class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Category</label>
                        <select name="category"
                            class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none">
                            <option value="Snacks">Snacks</option>
                            <option value="Meals">Meals</option>
                            <option value="Desserts">Desserts</option>
                            <option value="Beverages">Beverages</option>
                        </select>
                    </div>
                    <div>
                        <label
                            class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Sub-Cat</label>
                        <input type="text" name="subcategory" placeholder="e.g. Chips"
                            class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Stock</label>
                        <input type="number" name="stock" value="50"
                            class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label
                            class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Discount</label>
                        <input type="text" name="discount" value="0%"
                            class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Delivery
                            Time</label>
                        <input type="text" name="deliverytime" value="30-45 mins"
                            class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Image
                            URL</label>
                        <input type="url" name="image" placeholder="https://..."
                            class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none">
                    </div>
                </div>

                <div class="pt-6 border-t border-white/10">
                    <button type="submit" id="submitBtn"
                        class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl uppercase tracking-widest shadow-lg transition-all">
                        Launch Product
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script>
        const CONFIG = {
            BASE_URL: 'https://gruhini2.onrender.com'
        };

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        function openModal() {
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        // --- CORE LOGIC: MATCHING BACKEND CONTRACT ---
        async function handleAddProduct(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerText;

            btn.innerText = "Processing...";
            btn.disabled = true;
            btn.classList.add('opacity-50');

            const form = e.target;
            const formData = new FormData(form);

            // Construct Payload EXACTLY as requested
            const payload = {
                name: formData.get('name'),
                description: formData.get('description'),
                price: Number(formData.get('price')),
                category: formData.get('category'),
                subcategory: formData.get('subcategory'),
                stock: Number(formData.get('stock')),
                discount: formData.get('discount'),
                deliverytime: formData.get('deliverytime'), // Note: lowercase 't' per contract
                image: formData.get('image') || "https://images.unsplash.com/photo-1546833999-b9f5816029bd?q=80&w=600",

                // Hardcoded Defaults per Backend requirements
                verified: true,
                rating: 4.5,    // Default start rating
                badge: "New",
                status: "AVAILABLE"
            };

            try {
                const token = localStorage.getItem('authToken');

                const response = await fetch(`${CONFIG.BASE_URL}/add-product`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("Failed to add product");

                alert("Dish Added Successfully! 🍛");
                closeModal();
                form.reset();
                // Reload to reflect changes (temporary until we build dynamic fetching)
                setTimeout(() => window.location.reload(), 1000);

            } catch (err) {
                console.error(err);
                alert("Error: " + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        // Set Shop Name
        const userName = localStorage.getItem('userName');
        if (userName) document.getElementById('shopNameDisplay').innerText = userName + "'s Kitchen";
    </script>

</body>

</html>
