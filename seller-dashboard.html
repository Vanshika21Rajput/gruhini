<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gruhini - Seller</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { amber: { 600: '#d97706', 700: '#b45309' }, royalDark: '#0f0805', glass: 'rgba(255, 255, 255, 0.05)' }, fontFamily: { cinzel: ['Cinzel', 'serif'], sans: ['Lato', 'sans-serif'] } } } }
    </script>
    <script src="js/config.js"></script>
</head>

<body class="bg-royalDark text-amber-50 font-sans antialiased min-h-screen">
    <script>if (!localStorage.getItem('authToken') || localStorage.getItem('userRole') !== 'SELLER') window.location.href = 'login.html';</script>

    <nav
        class="fixed top-0 w-full z-50 bg-royalDark/95 border-b border-white/10 px-6 py-4 flex justify-between items-center backdrop-blur-md">
        <div class="flex items-center gap-4"><a href="index.html"
                class="font-cinzel text-xl font-bold text-amber-500 tracking-widest">GRUHINI</a><span
                class="text-xs bg-amber-900/50 px-2 py-1 rounded border border-amber-700/50 text-amber-200">SELLER
                HUB</span></div>
        <button onclick="localStorage.clear(); window.location.href='login.html'"
            class="text-xs text-red-400 font-bold uppercase tracking-widest">Logout</button>
    </nav>

    <div class="pt-28 px-4 max-w-6xl mx-auto">
        <div class="flex justify-between items-end mb-12">
            <div>
                <h1 class="font-cinzel text-4xl text-white mb-2">Manage Kitchen</h1>
                <p class="text-gray-400 text-sm">Add dishes & manage stock.</p>
            </div>
            <button onclick="document.getElementById('modal').classList.remove('hidden')"
                class="bg-amber-600 hover:bg-amber-500 text-white px-8 py-3 rounded-full font-bold text-sm tracking-widest uppercase shadow-lg">+
                Add Dish</button>
        </div>

        <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>
    </div>

    <div id="modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm"
            onclick="document.getElementById('modal').classList.add('hidden')"></div>
        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-2xl bg-[#1a0f0a] border border-amber-900/30 rounded-3xl shadow-2xl p-8 max-h-[90vh] overflow-y-auto">
            <h2 class="font-cinzel text-2xl text-amber-500 mb-6">Add New Dish</h2>
            <form onsubmit="addDish(event)" class="space-y-6">
                <div class="grid grid-cols-2 gap-6">
                    <input type="text" name="name" required placeholder="Dish Name"
                        class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white">
                    <input type="number" name="price" required placeholder="Price (₹)"
                        class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white">
                </div>
                <textarea name="description" required rows="3" placeholder="Description"
                    class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white"></textarea>
                <div class="grid grid-cols-2 gap-6">
                    <select name="category" class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white">
                        <option value="Food">Food</option>
                        <option value="Snacks">Snacks</option>
                    </select>
                    <input type="text" name="subcategory" placeholder="Sub-Cat"
                        class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white">
                    <input type="number" name="stock" value="50"
                        class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white">
                    <input type="text" name="deliverytime" value="45 mins"
                        class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white">
                </div>
                <input type="file" name="image" required accept="image/*" class="w-full text-white text-sm">
                <button type="submit" id="btn"
                    class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl uppercase tracking-widest shadow-lg">Launch
                    Product</button>
            </form>
        </div>
    </div>

    <script>
        async function loadMyProducts() {
            try {
                const res = await fetch(`${window.CONFIG.BASE_URL}/explore`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('productsGrid').innerHTML = data.map(p => `
                        <div class="bg-glass border border-white/10 rounded-2xl overflow-hidden group hover:border-amber-500/50 transition-all relative">
                            <div class="h-40 overflow-hidden"><img src="${p.image || window.CONFIG.PLACEHOLDER}" class="w-full h-full object-cover"></div>
                            <div class="p-5">
                                <h3 class="font-cinzel text-lg text-white font-bold">${p.name}</h3>
                                <span class="font-cinzel text-xl text-amber-500">₹${p.price}</span>
                            </div>
                        </div>`).join('');
                }
            } catch (e) { console.error(e); }
        }

        async function addDish(e) {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.innerText = "Uploading..."; btn.disabled = true;

            const form = new FormData(e.target);
            const jsonData = {
                name: form.get('name'), description: form.get('description'), price: Number(form.get('price')),
                category: form.get('category'), subcategory: form.get('subcategory'), stock: Number(form.get('stock')),
                deliverytime: form.get('deliverytime'), discount: "0%", verified: true, rating: 4.5, badge: "New", status: "APPROVED", quantity: 1
            };

            const payload = new FormData();
            payload.append("data", JSON.stringify(jsonData));
            payload.append("image", form.get('image'));

            try {
                const res = await fetch(`${window.CONFIG.BASE_URL}/add-product`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` },
                    body: payload
                });
                if (!res.ok) throw new Error(await res.text());
                alert("Success!");
                window.location.reload();
            } catch (err) {
                alert("Failed: " + err.message);
                btn.innerText = "Launch Product"; btn.disabled = false;
            }
        }
        loadMyProducts();
    </script>
</body>

</html>
