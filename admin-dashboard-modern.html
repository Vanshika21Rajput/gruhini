<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRUHANI – Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --gold-main: #D4AF37;
      --gold-dim: #c5a059;
      --gold-accent: #e2b091;
      --dark: #0f0805;
      --dark2: #1a0f0a;
      --text: #f5f1e8;
      --muted: rgba(245,241,232,0.6);
      --muted2: rgba(245,241,232,0.4);
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --blue: #3b82f6;
      --border: rgba(212,175,55,0.2);
      --border2: rgba(212,175,55,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: url('background2.png') center/cover fixed no-repeat, linear-gradient(135deg, #0f0805 0%, #1a0f0a 50%, #0f0805 100%);
      background-blend-mode: overlay;
      min-height: 100vh;
      color: var(--text);
      font-family: 'Lato', sans-serif;
      line-height: 1.6;
    }
    
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -2;
      background: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(212, 175, 55, 0.02) 2px, rgba(212, 175, 55, 0.02) 4px),
                  radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
      pointer-events: none;
    }
    
    nav {
      position: fixed; top: 0; width: 100%; z-index: 100; display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; background: linear-gradient(90deg, rgba(15,8,5,0.95), rgba(26,15,10,0.92));
      backdrop-filter: blur(20px); border-bottom: 2px solid var(--border); box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    
    .nav-brand { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--gold-main); letter-spacing: 0.15em; }
    .nav-badge { font-family: 'Cinzel', serif; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 6px 14px; border-radius: 6px; background: rgba(212,175,55,0.1); color: var(--gold-main); border: 1px solid var(--border2); }
    
    main { padding: 100px 40px 60px; max-width: 1400px; margin: 0 auto; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: linear-gradient(135deg, rgba(212,175,55,0.08), rgba(212,175,55,0.04)); border: 2px solid var(--border); border-radius: 16px; padding: 24px; position: relative; }
    .stat-value { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 700; color: var(--gold-main); }

    .tabs-nav { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 32px; overflow-x: auto; }
    .tab-btn { padding: 14px 24px; border: none; background: transparent; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; font-weight: 600; transition: 0.3s; }
    .tab-btn.active { color: var(--gold-main); border-bottom-color: var(--gold-main); }

    .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: rgba(212,175,55,0.05); border-radius: 12px; margin-bottom: 20px; flex-wrap: wrap; gap: 16px;}
    .toolbar-left { display: flex; align-items: center; gap: 16px; }
    .search-bar { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-family: 'Lato', sans-serif; font-size: 13px; width: 250px; transition: 0.3s; }
    .search-bar:focus { outline: none; border-color: var(--gold-main); box-shadow: 0 0 0 2px rgba(212,175,55,0.2); }

    .btn { padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; text-transform: uppercase; border: none; transition: 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px;}
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-green { background: linear-gradient(135deg, #166534, #22c55e); color: white; }
    .btn-red { background: linear-gradient(135deg, #991b1b, #ef4444); color: white; }
    .btn-gold { background: linear-gradient(135deg, var(--gold-main), var(--gold-dim)); color: var(--dark); }
    .btn-gold:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(212,175,55,0.3); }

    .approval-list { display: flex; flex-direction: column; gap: 14px; }
    .approval-card { background: rgba(212,175,55,0.05); border: 2px solid var(--border); border-radius: 14px; padding: 18px; display: flex; gap: 16px; cursor: pointer; transition: 0.3s; }
    .approval-card:hover { border-color: var(--border2); transform: translateY(-2px); }
    .approval-card.selected { border-color: var(--gold-main); background: rgba(212,175,55,0.15); }
    
    /* MODAL SAFETY UX FIX */
    .modal-overlay { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); padding: 20px; pointer-events: none; }
    .modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; pointer-events: all; }
    .modal { background: #1a0f0a; border: 2px solid var(--border2); border-radius: 18px; padding: 32px; width: 100%; max-width: 550px; position: relative; max-height: 90vh; overflow-y: auto; }
    
    /* CHECKBOX FIX (Cursor added, bubbling handled in JS) */
    .approval-checkbox { width: 18px; height: 18px; accent-color: var(--gold-main); cursor: pointer; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .badge-pending { color: var(--amber); display: inline-flex; align-items: center; gap: 4px; font-size: 11px; background: rgba(245,158,11,0.1); padding: 2px 8px; border-radius: 12px; border: 1px solid rgba(245,158,11,0.3); }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--dark); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }
    
    .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { padding: 7px 16px; border-radius: 20px; font-family: 'Lato', sans-serif; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.05em; }
    .chip:hover, .chip.active { background: rgba(212,175,55,0.15); border-color: var(--border2); color: var(--gold-main); }
  </style>
</head>
<body>

<nav>
  <div style="display:flex;align-items:center;gap:12px;">
    <div style="width:32px;height:32px;border-radius:50%;overflow:hidden;border:2px solid var(--gold-main);">
      <img src="public/logo.jpg" alt="gruhani" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
    </div>
    <span class="nav-brand">GRUHANI</span>
    <span class="nav-badge">👑 ADMIN PORTAL</span>
  </div>
  <div class="nav-right">
    <button onclick="refreshAll()" style="background:transparent; border:none; cursor:pointer; color:var(--muted);"><i data-lucide="refresh-cw" style="width:16px;"></i></button>
    <button class="logout" onclick="localStorage.clear(); window.location.href='login.html'" style="background:transparent; border:none; cursor:pointer; color:var(--red); font-weight:600; font-family:'Cinzel', serif;">Logout</button>
  </div>
</nav>

<div id="toastContainer" style="position:fixed; top:80px; right:20px; z-index:999;"></div>

<main>
  <div class="page-header">
    <h1 class="page-title">🎛️ Admin Dashboard</h1>
    <p class="page-sub">Manage platform • Approve dishes • Manage sellers • View orders</p>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="statSellers">0</div>
      <div style="font-size:12px; color:var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;">Pending Sellers</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statPending">0</div>
      <div style="font-size:12px; color:var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;">Pending Dishes</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statOrders">0</div>
      <div style="font-size:12px; color:var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;">Total Orders</div>
    </div>
  </div>

  <div class="tabs-nav">
    <button class="tab-btn" onclick="switchTab('pending', this)">Pending Approvals</button>
    <button class="tab-btn" onclick="switchTab('products', this)">All Dishes</button>
    <button class="tab-btn active" onclick="switchTab('sellers', this)">Sellers</button>
    <button class="tab-btn" onclick="switchTab('orders', this)">Orders</button>
  </div>

  <div id="tab-pending" class="tab-panel" style="display:none;">
    <div class="toolbar">
      <div class="toolbar-left">
        <label style="cursor:pointer;"><input type="checkbox" id="selectAllPending" onchange="toggleSelectAll('pending', this.checked)"> Select All</label>
        <span id="pendingSelectionInfo" style="margin-left:10px; color:var(--gold-main); font-weight:600;"></span>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-green" id="bulkApproveBtn" onclick="bulkApprove()" disabled>✅ Approve</button>
        <button class="btn btn-red" id="bulkRejectBtn" onclick="openBulkRejectModal()" disabled>❌ Reject</button>
      </div>
    </div>
    <div id="pendingList" class="approval-list"></div>
    <div id="noPending" style="display:none; text-align:center; padding:60px 20px; color:var(--muted);">
      <i data-lucide="check-circle" style="width:48px;height:48px;color:var(--green);margin-bottom:16px;"></i>
      <h3 style="color:var(--text);font-family:'Playfair Display',serif;font-size:20px;margin-bottom:8px;">All Set!</h3>
      <p style="font-size:13px;">No pending dishes.</p>
    </div>
  </div>

  <div id="tab-products" class="tab-panel" style="display:none;">
    <div class="toolbar">
      <div class="toolbar-left">
        <label class="select-all-label">
          <input type="checkbox" id="selectAllProducts" onchange="toggleSelectAll('allProds', this.checked)">
          Select All
        </label>
        <span class="selection-info" id="allProdsSelectionInfo"></span>
      </div>
      <button class="btn btn-red btn-sm" onclick="bulkDeleteProducts()" id="bulkDeleteBtn" disabled>
        <i data-lucide="trash-2" style="width:14px;height:14px"></i> Delete Selected
      </button>
    </div>
    <div id="allProductsList" class="approval-list" style="display:none"></div>
    <div id="allProductsLoading" style="text-align:center; padding:60px;"><span class="spinner"></span></div>
    <div id="noAllProducts" style="display:none; text-align:center; padding:60px 20px; color:var(--muted);">
      <i data-lucide="package-x" style="width:48px;height:48px;margin-bottom:16px;"></i>
      <h3 style="color:var(--text);font-family:'Playfair Display',serif;font-size:20px;">No Dishes Yet</h3>
    </div>
  </div>

  <div id="tab-sellers" class="tab-panel" style="display:block;">
    <div class="toolbar">
      <div class="toolbar-left">
        <label style="cursor:pointer;">
          <input type="checkbox" id="selectAllSellersCheckbox" onchange="toggleSelectAllSellers(this.checked)">
          Select All
        </label>
        <span id="sellerSelectionInfo" style="margin-left:10px; color:var(--gold-main); font-weight:600;"></span>
      </div>
      
      <div style="display:flex; gap:12px; align-items:center;">
        <div style="position: relative;">
          <i data-lucide="search" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; color: var(--muted);"></i>
          <input type="text" id="sellerSearchInput" class="search-bar" placeholder="Search sellers by name..." oninput="handleSellerSearch()" style="padding-left: 32px;">
        </div>
        <button class="btn btn-green" onclick="bulkApproveSellers()" id="approveSellerBtn" disabled>✅ Approve</button>
      </div>
    </div>
    <div id="sellersList" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:20px;"></div>
    <div id="sellersLoading" style="text-align:center; padding:60px;">
      <span class="spinner" style="width:24px; height:24px; border-width: 3px;"></span>
      <p style="margin-top:12px; color:var(--muted);">Loading Sellers...</p>
    </div>
  </div>

  <div id="tab-orders" class="tab-panel" style="display:none;">
    <div class="toolbar">
      <div class="filter-chips">
        <button class="chip active" onclick="filterAdminOrders('', this)">All</button>
        <button class="chip" onclick="filterAdminOrders('PENDING', this)">Pending</button>
        <button class="chip" onclick="filterAdminOrders('ACCEPTED', this)">Accepted</button>
        <button class="chip" onclick="filterAdminOrders('DELIVERED', this)">Delivered</button>
        <button class="chip" onclick="filterAdminOrders('REJECTED', this)">Rejected</button>
        <button class="chip" onclick="filterAdminOrders('CANCELLED', this)">Cancelled</button>
      </div>
    </div>
    <div id="adminOrdersList" class="approval-list" style="display:none"></div>
    <div id="ordersLoading" style="text-align:center; padding:60px;"><span class="spinner"></span></div>
    <div id="noAdminOrders" style="display:none; text-align:center; padding:60px 20px; color:var(--muted);">
      <i data-lucide="inbox" style="width:48px;height:48px;margin-bottom:16px;"></i>
      <h3 style="color:var(--text);font-family:'Playfair Display',serif;font-size:20px;">No Orders Yet</h3>
    </div>
  </div>
</main>

<div id="bulkRejectModal" class="modal-overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeBulkRejectModal()"><i data-lucide="x" style="width:18px;height:18px"></i></button>
    <h2 style="color:var(--text); font-family:'Playfair Display',serif; margin-bottom:20px;">Reject Dishes</h2>
    <div class="form-group">
      <label class="form-label">Reason for Rejection</label>
      <textarea id="rejectReasonInput" class="form-textarea" placeholder="E.g. image quality issues, ingredient restricted..."></textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-red" onclick="submitBulkReject()">Reject</button>
      <button class="btn btn-gold" onclick="closeBulkRejectModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="sellerDetailModal" class="modal-overlay">
  <div class="modal" style="max-width:560px;">
    <button style="position:absolute; top:20px; right:20px; background:transparent; border:none; color:var(--muted); cursor:pointer;" onclick="closeSellerModal()">
      <i data-lucide="x" style="width:20px; height:20px;"></i>
    </button>
    <div id="sellerDetailContent"></div>
  </div>
</div>

<div id="orderDetailModal" class="modal-overlay">
  <div class="modal" style="max-width:560px;">
    <button style="position:absolute; top:20px; right:20px; background:transparent; border:none; color:var(--muted); cursor:pointer;" onclick="closeOrderModal()">
      <i data-lucide="x" style="width:20px; height:20px;"></i>
    </button>
    <div id="orderDetailContent"></div>
  </div>
</div>

<script src="js/config.js"></script>

<script>
// ===== GLOBAL STATE & CONFIG =====
const BASE_URL = (window.CONFIG && window.CONFIG.BASE_URL) ? window.CONFIG.BASE_URL : 'https://gruhani-backend.onrender.com';

let allPendingProducts = [], allProducts = [], allSellers = [], allAdminOrders = [];
let filteredSellers = []; 
let selectedPendingIds = new Set(), selectedAllProdIds = new Set(), selectedSellerIds = new Set();
let currentOrderFilter = '';

function getToken() { return localStorage.getItem('authToken') || ''; }

function toast(msg, type = 'success') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`; 
  t.style.background = type === 'error' ? 'linear-gradient(135deg, #991b1b, #ef4444)' : 'linear-gradient(135deg, #166534, #22c55e)';
  t.style.color = '#fff'; t.style.padding = '14px 20px'; t.style.borderRadius = '10px'; t.style.marginBottom = '10px';
  t.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)'; t.style.display = 'flex'; t.style.alignItems = 'center'; t.style.gap = '8px';
  t.style.transition = 'opacity 0.3s, transform 0.3s';
  
  const icon = type === 'error' ? '<i data-lucide="alert-circle" style="width:16px;"></i>' : '<i data-lucide="check-circle" style="width:16px;"></i>';
  t.innerHTML = `${icon} <span style="font-size:13px; font-weight:600;">${msg}</span>`;
  
  c.appendChild(t); 
  lucide.createIcons();
  
  setTimeout(() => { 
    t.style.opacity = '0'; 
    t.style.transform = 'translateX(20px)'; 
    setTimeout(() => t.remove(), 300); 
  }, 3500);
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).style.display = 'block';
  btn.classList.add('active');
  lucide.createIcons();
}

function statusClass(status) {
  const map = {
    'APPROVED': 'approved', 'PENDING': 'pending', 'REJECTED': 'rejected',
    'DELIVERED': 'delivered', 'ACCEPTED': 'accepted', 'CANCELLED': 'cancelled'
  };
  return map[(status || '').toUpperCase()] || 'pending';
}

function fmt(val) {
  return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0 }).format(val || 0);
}

function fmtDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch { return d; }
}

function show(id) { const el = document.getElementById(id); if (el) el.style.display = 'block'; }
function hide(id) { const el = document.getElementById(id); if (el) el.style.display = 'none'; }

// Force-close any stuck modals on load
window.onload = () => {
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open'));
};

// ==========================================
// 1. SELLERS LOGIC (STRICT PENDING API)
// ==========================================

async function loadSellers() {
  document.getElementById('sellersLoading').style.display = 'block';
  document.getElementById('sellersList').style.display = 'none';
  
  try {
    // Only fetch pending sellers, strictly aligned with backend capabilities
    const res = await fetch(`${BASE_URL}/admin/pending-seller`, {
      headers: { Authorization: `Bearer ${getToken()}` }
    });
    
    if (!res.ok) throw new Error(await res.text() || `HTTP error! status: ${res.status}`);
    
    const data = await res.json();
    allSellers = Array.isArray(data) ? data : [];
    filteredSellers = [...allSellers]; 
    selectedSellerIds.clear();
    
    document.getElementById('statSellers').textContent = allSellers.length;
    renderSellers();
  } catch(e) { 
    toast('Failed to load sellers: ' + e.message, 'error'); 
  } finally {
    document.getElementById('sellersLoading').style.display = 'none';
  }
}

function handleSellerSearch() {
  const query = document.getElementById('sellerSearchInput').value.toLowerCase();
  filteredSellers = allSellers.filter(s => {
    const bName = (s.businessName || '').toLowerCase();
    const oName = (s.name || '').toLowerCase();
    return bName.includes(query) || oName.includes(query);
  });
  
  const selectAllBox = document.getElementById('selectAllSellersCheckbox');
  if (selectAllBox) {
    const allVisibleSelected = filteredSellers.length > 0 && filteredSellers.every(s => selectedSellerIds.has(s.id));
    selectAllBox.checked = allVisibleSelected;
  }
  
  renderSellers();
}

function renderSellers() {
  const container = document.getElementById("sellersList");
  container.style.display = 'grid';
  
  if (!filteredSellers.length) {
    container.innerHTML = `
      <div style="grid-column: 1 / -1; text-align:center; padding:60px 20px; background:rgba(0,0,0,0.2); border-radius:16px; border:1px dashed var(--border);">
        <i data-lucide="users" style="width:48px;height:48px;color:var(--muted);margin-bottom:16px;"></i>
        <h3 style="color:var(--text);font-family:'Playfair Display',serif;font-size:20px;margin-bottom:8px;">No Sellers Found</h3>
        <p style="color:var(--muted);font-size:13px;">${allSellers.length ? 'No sellers match your search.' : 'All sellers are processed or none are registered yet.'}</p>
      </div>
    `;
    lucide.createIcons();
    return;
  }

  container.innerHTML = filteredSellers.map(s => {
    const isSelected = selectedSellerIds.has(s.id);
    const addr = s.address || {};
    const loc = [addr.city, addr.state].filter(Boolean).join(', ') || 'Address not provided';
    
    // Explicitly hardcoded pending since this is the pending-seller endpoint route
    const badgeHTML = `<span class="badge-pending"><i data-lucide="clock" style="width:12px;"></i> Pending</span>`;
    const descText = s.description || s.Description || 'No details provided by the chef.';

    return `
      <div class="approval-card ${isSelected ? 'selected' : ''}" onclick="toggleSellerSelection(${s.id})" style="flex-direction:column; padding:0; overflow:hidden;">
        
        <div style="padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:flex-start;">
          <div style="display:flex; gap:12px;">
            <div style="width:48px; height:48px; background:var(--dark2); border:1px solid var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:24px; overflow:hidden;">
              ${s.image ? `<img src="${s.image}" style="width:100%;height:100%;object-fit:cover;">` : '👨‍🍳'}
            </div>
            <div>
              <h3 style="font-size:16px; color:var(--text); font-family:'Playfair Display', serif;">${s.businessName || s.name}</h3>
              <p style="font-size:11px; color:var(--gold-main); font-weight:600; margin-top:2px;">Owner: ${s.name}</p>
            </div>
          </div>
          <input type="checkbox" class="approval-checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleSellerSelection(${s.id})">
        </div>

        <div style="padding: 16px; flex: 1;">
          <div style="margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
             ${badgeHTML}
             <span style="font-size:11px; color:var(--muted);"><i data-lucide="phone" style="width:10px; margin-right:4px;"></i>${s.contact}</span>
          </div>
          <p style="font-size:12px; color:var(--muted); margin-bottom:8px; display:flex; gap:6px;"><i data-lucide="map-pin" style="width:12px; flex-shrink:0;"></i> ${loc}</p>
          <div style="font-size:11px; color:var(--muted2); line-height:1.5; background:rgba(0,0,0,0.3); padding:8px 10px; border-radius:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">
            ${descText}
          </div>
        </div>
        
        <div style="padding: 12px 16px; background: rgba(212,175,55,0.02); border-top: 1px solid var(--border);">
          <button class="btn btn-gold" style="width:100%; font-size:11px; padding:8px;" onclick="event.stopPropagation(); openSellerModal(${s.id})">
             👁️ View Full Profile
          </button>
        </div>

      </div>
    `;
  }).join("");

  updateSellerSelectionUI();
  lucide.createIcons();
}

function toggleSellerSelection(id) {
  selectedSellerIds.has(id) ? selectedSellerIds.delete(id) : selectedSellerIds.add(id);
  
  const selectAllBox = document.getElementById('selectAllSellersCheckbox');
  if (selectAllBox) {
    const allVisibleSelected = filteredSellers.length > 0 && filteredSellers.every(s => selectedSellerIds.has(s.id));
    selectAllBox.checked = allVisibleSelected;
  }
  
  renderSellers();
}

function toggleSelectAllSellers(checked) {
  if (checked) {
    filteredSellers.forEach(s => selectedSellerIds.add(s.id));
  } else {
    filteredSellers.forEach(s => selectedSellerIds.delete(s.id));
  }
  renderSellers();
}

function updateSellerSelectionUI() {
  const count = selectedSellerIds.size;
  document.getElementById("sellerSelectionInfo").innerText = count > 0 ? `${count} selected` : "";
  document.getElementById("approveSellerBtn").disabled = count === 0;
}

async function bulkApproveSellers() {
  if (!selectedSellerIds.size) return;
  
  const msg = prompt("Enter approval message for selected chefs:");
  if (msg === null) return; 
  
  const btn = document.getElementById("approveSellerBtn");
  const originalHtml = btn.innerHTML;
  btn.innerHTML = `<span class="spinner" style="border-top-color:white;"></span> Processing...`;
  btn.disabled = true;

  try {
    const res = await fetch(`${BASE_URL}/admin/approve-seller`, {
      method: "POST",
      headers: { Authorization: `Bearer ${getToken()}`, "Content-Type": "application/json" },
      body: JSON.stringify({ selectedProducts: Array.from(selectedSellerIds), message: msg || "Account verified." })
    });
    
    if (!res.ok) {
      const errorText = await res.text();
      throw new Error(errorText || "Server returned an error");
    }
    
    toast(`✅ ${selectedSellerIds.size} Sellers Approved`);
    selectedSellerIds.clear();
    
    document.getElementById('sellerSearchInput').value = '';
    await loadSellers();
  } catch (e) { 
    toast("Approval Failed: " + e.message, "error"); 
  } finally {
    btn.innerHTML = originalHtml;
    updateSellerSelectionUI();
  }
}

// ===== SELLER DETAIL MODAL =====
async function openSellerModal(id) {
  document.getElementById('sellerDetailModal').classList.add('open');
  const content = document.getElementById('sellerDetailContent');
  content.innerHTML = `<div style="text-align:center; padding:40px;"><span class="spinner"></span><p style="margin-top:10px; color:var(--muted); font-size:12px;">Loading Details...</p></div>`;
  
  try {
    const res = await fetch(`${BASE_URL}/admin/view-seller/${id}`, { headers: { Authorization: `Bearer ${getToken()}` } });
    if (!res.ok) throw new Error(await res.text() || `Status: ${res.status}`);
    
    const s = await res.json();
    const addr = s.address || {};
    const fullLoc = [addr.addressLine, addr.city, addr.state, addr.pincode].filter(Boolean).join(', ') || 'N/A';
    
    content.innerHTML = `
      <div style="display:flex; align-items:center; gap:16px; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border);">
        <div style="width:64px; height:64px; border-radius:16px; background:var(--dark2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:32px; overflow:hidden;">
          ${s.image ? `<img src="${s.image}" style="width:100%;height:100%;object-fit:cover;">` : '👨‍🍳'}
        </div>
        <div>
          <h2 style="color:var(--text); font-family:'Playfair Display',serif; font-size:24px; margin-bottom:4px;">${s.businessName || s.name}</h2>
          <span style="font-size:12px; color:var(--gold-main); font-weight:600; text-transform:uppercase; letter-spacing:0.05em;">Owner: ${s.name}</span>
        </div>
      </div>
      
      <div style="display:grid; grid-template-columns: 100px 1fr; gap:12px; font-size:13px; margin-bottom:24px;">
        <span style="color:var(--muted); font-weight:600;">Contact</span><span style="color:var(--text);">${s.contact || 'N/A'}</span>
        <span style="color:var(--muted); font-weight:600;">Address</span><span style="color:var(--text);">${fullLoc}</span>
      </div>
      
      <div style="background:rgba(212,175,55,0.05); padding:16px; border-radius:12px; border:1px solid var(--border2); margin-bottom:24px;">
        <span style="display:block; font-size:11px; color:var(--gold-main); font-weight:700; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px;">About the Kitchen</span>
        <p style="color:var(--muted); font-size:13px; line-height:1.6;">${s.description || s.Description || 'No detailed description provided by this chef.'}</p>
      </div>

      <div style="display:flex; gap:12px;">
        <button class="btn btn-red" style="flex:1;" onclick="deleteSellerSingle(${s.id})"><i data-lucide="trash-2" style="width:14px;"></i> Delete Account</button>
        <button class="btn btn-gold" style="flex:1;" onclick="closeSellerModal()">Close Profile</button>
      </div>
    `;
    lucide.createIcons();
  } catch(e) { 
    content.innerHTML = `<div style="text-align:center; padding:40px; color:var(--red);">Failed to load profile details.<br><span style="font-size:11px;">${e.message}</span></div>`; 
  }
}

function closeSellerModal() { document.getElementById('sellerDetailModal').classList.remove('open'); }

// Strictly single delete utilizing Path Variable format
async function deleteSellerSingle(id) {
  if (!confirm('Delete this seller and all their data? This cannot be undone.')) return;

  try {
    const res = await fetch(`${BASE_URL}/admin/delete-seller/${id}`, {
      method: "DELETE",
      headers: { Authorization: `Bearer ${getToken()}` }
    });
    
    if (!res.ok) {
      const errorText = await res.text();
      throw new Error(errorText || "Server error");
    }
    
    toast(`🗑 Seller Removed`);
    closeSellerModal();
    selectedSellerIds.delete(id);
    await loadSellers();
  } catch (e) { 
    toast("Delete Failed: " + e.message, "error"); 
  }
}

// ==========================================
// 2. DISHES & PENDING LOGIC 
// ==========================================

async function loadPending() {
  document.getElementById('pendingList').style.display = 'none';
  document.getElementById('noPending').style.display = 'none';
  
  try {
    const res = await fetch(`${BASE_URL}/admin/view-pending`, {
      headers: { Authorization: `Bearer ${getToken()}` }
    });
    if (!res.ok) throw new Error(`Server ${res.status}`);
    const data = await res.json();
    allPendingProducts = Array.isArray(data) ? data : [];
    selectedPendingIds.clear();
    
    renderPending();
    document.getElementById('pendingCount').textContent = allPendingProducts.length;
    document.getElementById('statPending').textContent = allPendingProducts.length;
  } catch(e) {
    document.getElementById('noPending').style.display = 'block';
    document.getElementById('noPending').innerHTML = `
      <div class="empty-icon"><i data-lucide="alert-circle" style="width:32px;height:32px;color:var(--red)"></i></div>
      <h3 style="color:var(--text);font-size:20px;margin-bottom:8px;">Could not load</h3>
      <p style="color:var(--muted);font-size:13px;">${e.message}</p>
    `;
    lucide.createIcons();
  }
}

function renderPending() {
  const list = document.getElementById('pendingList');
  const empty = document.getElementById('noPending');
  
  if (!allPendingProducts.length) { 
    list.style.display = 'none'; 
    empty.style.display = 'block'; 
    return; 
  }
  
  empty.style.display = 'none'; 
  list.style.display = 'flex';

  list.innerHTML = allPendingProducts.map(p => `
    <div class="approval-card ${selectedPendingIds.has(p.id) ? 'selected' : ''}" onclick="togglePendingCheckbox(${p.id})">
      <input type="checkbox" class="approval-checkbox" ${selectedPendingIds.has(p.id) ? 'checked' : ''} onclick="event.stopPropagation(); togglePendingCheckbox(${p.id})">
      <div style="width:70px;height:70px;border-radius:12px;background:var(--dark2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;">
        ${p.image ? `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentNode.innerHTML='<i data-lucide=\\'image\\' style=\\'width:28px;height:28px;color:var(--muted2)\\'></i>'">` : `<i data-lucide="utensils" style="width:28px;height:28px;color:var(--muted2)"></i>`}
      </div>
      <div class="approval-body">
        <div class="approval-name">${p.productName || p.name || 'Untitled'}</div>
        <div class="approval-meta">
          <span><i data-lucide="user" style="width:11px;height:11px"></i> ${p.sellerName || '—'}</span>
          <span><i data-lucide="tag" style="width:11px;height:11px"></i> ${fmt(p.price)}</span>
        </div>
        <div class="approval-desc" style="display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${p.description || p.Description || 'No description'}</div>
      </div>
    </div>`).join('');
  lucide.createIcons();
  updatePendingSelectionInfo();
}

function togglePendingCheckbox(id) {
  selectedPendingIds.has(id) ? selectedPendingIds.delete(id) : selectedPendingIds.add(id);
  
  const selectAllBox = document.getElementById('selectAllPending');
  if (selectAllBox) {
    selectAllBox.checked = allPendingProducts.length > 0 && selectedPendingIds.size === allPendingProducts.length;
  }
  renderPending();
}

function toggleSelectAll(tab, checked) {
  if (tab === 'pending') {
    selectedPendingIds.clear();
    if (checked) allPendingProducts.forEach(p => selectedPendingIds.add(p.id));
    renderPending();
  } else if (tab === 'allProds') {
    selectedAllProdIds.clear();
    if (checked) allProducts.forEach(p => selectedAllProdIds.add(p.id));
    renderAllProducts();
  }
}

function updatePendingSelectionInfo() {
  const count = selectedPendingIds.size;
  document.getElementById('pendingSelectionInfo').textContent = count > 0 ? `${count} selected` : '';
  document.getElementById('bulkApproveBtn').disabled = count === 0;
  document.getElementById('bulkRejectBtn').disabled = count === 0;
}

async function bulkApprove() {
  if (!selectedPendingIds.size) return;
  const btn = document.getElementById('bulkApproveBtn');
  const original = btn.innerHTML;
  btn.innerHTML = `<span class="spinner" style="border-top-color:white;"></span>`;
  
  try {
    const res = await fetch(`${BASE_URL}/admin/accept-item`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ selectedProducts: Array.from(selectedPendingIds) })
    });
    if (!res.ok) throw new Error(await res.text());
    toast(`✅ ${selectedPendingIds.size} dishes approved!`);
    selectedPendingIds.clear();
    loadPending(); loadAllProducts();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
  finally { btn.innerHTML = original; }
}

function openBulkRejectModal() {
  if (!selectedPendingIds.size) return;
  document.getElementById('bulkRejectModal').classList.add('open');
  document.getElementById('rejectReasonInput').value = '';
}
function closeBulkRejectModal() { document.getElementById('bulkRejectModal').classList.remove('open'); }

async function submitBulkReject() {
  const message = document.getElementById('rejectReasonInput').value.trim();
  if (!message) { toast('Please provide a reason!', 'error'); return; }
  try {
    const res = await fetch(`${BASE_URL}/admin/reject-item`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ selectedProducts: Array.from(selectedPendingIds), message })
    });
    if (!res.ok) throw new Error(await res.text());
    toast(`❌ ${selectedPendingIds.size} dishes rejected`);
    closeBulkRejectModal();
    selectedPendingIds.clear();
    loadPending(); loadAllProducts();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

// ==========================================
// 3. ALL PRODUCTS LOGIC
// ==========================================

async function loadAllProducts() {
  document.getElementById('allProductsLoading').style.display = 'block';
  document.getElementById('allProductsList').style.display = 'none';
  document.getElementById('noAllProducts').style.display = 'none';
  
  try {
    const res = await fetch(`${BASE_URL}/admin/products-viewAll`, {
      headers: { Authorization: `Bearer ${getToken()}` }
    });
    if (!res.ok) throw new Error(`Server ${res.status}`);
    const data = await res.json();
    allProducts = Array.isArray(data) ? data : [];
    selectedAllProdIds.clear();
    
    document.getElementById('allProductsCount').textContent = allProducts.length;
    renderAllProducts();
  } catch(e) {
    document.getElementById('noAllProducts').style.display = 'block';
  } finally {
    document.getElementById('allProductsLoading').style.display = 'none';
  }
}

function renderAllProducts() {
  const list = document.getElementById('allProductsList');
  const empty = document.getElementById('noAllProducts');
  
  if (!allProducts.length) { 
    list.style.display = 'none'; 
    empty.style.display = 'block'; 
    return; 
  }
  empty.style.display = 'none'; 
  list.style.display = 'flex';

  list.innerHTML = allProducts.map(p => `
    <div class="approval-card ${selectedAllProdIds.has(p.id) ? 'selected' : ''}" onclick="toggleProductCheckbox(${p.id})">
      <input type="checkbox" class="approval-checkbox" ${selectedAllProdIds.has(p.id) ? 'checked' : ''} onclick="event.stopPropagation(); toggleProductCheckbox(${p.id})">
      <div style="width:70px;height:70px;border-radius:12px;background:var(--dark2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;">
        ${p.image ? `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;">` : `<i data-lucide="utensils" style="width:28px;height:28px;color:var(--muted2)"></i>`}
      </div>
      <div class="approval-body">
        <div class="approval-name">${p.productName || p.name || 'Untitled'}</div>
        <div class="approval-meta">
          <span><i data-lucide="user" style="width:11px;height:11px"></i> ${p.sellerName || '—'}</span>
          <span><i data-lucide="tag" style="width:11px;height:11px"></i> ${fmt(p.price)}</span>
          <span><span class="status-pill status-${statusClass(p.productStatus)}">${p.productStatus || '—'}</span></span>
        </div>
        <div class="approval-desc" style="display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${p.description || p.Description || 'No description'}</div>
      </div>
    </div>`).join('');
  lucide.createIcons();
  updateProdSelectionInfo();
}

function toggleProductCheckbox(id) {
  selectedAllProdIds.has(id) ? selectedAllProdIds.delete(id) : selectedAllProdIds.add(id);
  const selectAllBox = document.getElementById('selectAllProducts');
  if (selectAllBox) {
    selectAllBox.checked = allProducts.length > 0 && selectedAllProdIds.size === allProducts.length;
  }
  renderAllProducts();
}

function updateProdSelectionInfo() {
  const count = selectedAllProdIds.size;
  document.getElementById('allProdsSelectionInfo').textContent = count > 0 ? `${count} selected` : '';
  document.getElementById('bulkDeleteBtn').disabled = count === 0;
}

async function bulkDeleteProducts() {
  if (!selectedAllProdIds.size) return;
  if (!confirm(`Delete ${selectedAllProdIds.size} product(s)? This cannot be undone.`)) return;
  
  const btn = document.getElementById('bulkDeleteBtn');
  const original = btn.innerHTML;
  btn.innerHTML = `<span class="spinner" style="border-top-color:white;"></span>`;
  
  try {
    const res = await fetch(`${BASE_URL}/admin/delete-product`, {
      method: 'DELETE',
      headers: { Authorization: `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ selectedProducts: Array.from(selectedAllProdIds) })
    });
    if (!res.ok) throw new Error(await res.text());
    toast(`🗑️ ${selectedAllProdIds.size} dishes deleted`);
    selectedAllProdIds.clear();
    loadAllProducts();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
  finally { btn.innerHTML = original; }
}

// ==========================================
// 4. ORDERS LOGIC
// ==========================================

async function loadAdminOrders() {
  document.getElementById('ordersLoading').style.display = 'block';
  document.getElementById('adminOrdersList').style.display = 'none';
  document.getElementById('noAdminOrders').style.display = 'none';
  
  try {
    const res = await fetch(`${BASE_URL}/admin/view-orders`, {
      headers: { Authorization: `Bearer ${getToken()}` }
    });
    if (!res.ok) throw new Error(`Server ${res.status}`);
    const data = await res.json();
    allAdminOrders = Array.isArray(data) ? data : [];
    
    document.getElementById('ordersCount').textContent = allAdminOrders.length;
    document.getElementById('statOrders').textContent = allAdminOrders.length;
    renderAdminOrders(allAdminOrders);
  } catch(e) {
    document.getElementById('noAdminOrders').style.display = 'block';
  } finally {
    document.getElementById('ordersLoading').style.display = 'none';
  }
}

function filterAdminOrders(status, btn) {
  currentOrderFilter = status;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  const filtered = status ? allAdminOrders.filter(o => (o.orderStatus || '').toUpperCase() === status.toUpperCase()) : allAdminOrders;
  renderAdminOrders(filtered);
}

function renderAdminOrders(orders) {
  const list = document.getElementById('adminOrdersList');
  const empty = document.getElementById('noAdminOrders');
  
  if (!orders.length) { 
    list.style.display = 'none'; 
    empty.style.display = 'block'; 
    return; 
  }
  empty.style.display = 'none'; 
  list.style.display = 'flex';

  list.innerHTML = orders.map(o => {
    const user = o.userDetails || {};
    const items = Array.isArray(o.orderItems) ? o.orderItems : [];
    const addr = o.deliveryAddress || {};
    const addrStr = [addr.city, addr.state].filter(Boolean).join(', ') || '—';

    return `
      <div class="approval-card" onclick='openOrderModal(${JSON.stringify(o).replace(/'/g, "&#39;")})' style="cursor:pointer;">
        <div style="width:70px;height:70px;border-radius:12px;background:var(--dark2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i data-lucide="shopping-bag" style="width:28px;height:28px;color:var(--gold-main)"></i>
        </div>
        <div class="approval-body">
          <div class="approval-name">
            Order #${String(o.id || '').slice(-6) || '—'}
            <span class="status-pill status-${statusClass(o.orderStatus)}" style="margin-left:8px;">${o.orderStatus || '—'}</span>
          </div>
          <div class="approval-meta">
            <span><i data-lucide="user" style="width:11px;height:11px"></i> ${user.name || '—'}</span>
            <span><i data-lucide="map-pin" style="width:11px;height:11px"></i> ${addrStr}</span>
          </div>
          <div class="approval-desc">
            <strong style="color:var(--gold-main)">${fmt(o.orderValue)}</strong> | ${items.length} item(s) | ${fmtDate(o.placedAt)}
          </div>
        </div>
      </div>`;
  }).join('');
  lucide.createIcons();
}

function openOrderModal(o) {
  const user = o.userDetails || {};
  const items = Array.isArray(o.orderItems) ? o.orderItems : [];
  const addr = o.deliveryAddress || {};
  const addrStr = [addr.addressLine, addr.city, addr.state, addr.pincode].filter(Boolean).join(', ') || '—';

  document.getElementById('orderDetailContent').innerHTML = `
    <div style="font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--text);margin-bottom:20px;">
      🛒 Order #${String(o.id || '').slice(-6)}
      <span class="status-pill status-${statusClass(o.orderStatus)}" style="margin-left:10px;font-size:11px;">${o.orderStatus || '—'}</span>
    </div>
    <div class="detail-row"><span class="detail-row-label">Customer</span><span class="detail-row-val">${user.name || '—'}</span></div>
    <div class="detail-row"><span class="detail-row-label">Contact</span><span class="detail-row-val">${user.contact || '—'}</span></div>
    <div class="detail-row"><span class="detail-row-label">Address</span><span class="detail-row-val">${addrStr}</span></div>
    <div class="detail-row"><span class="detail-row-label">Placed</span><span class="detail-row-val">${fmtDate(o.placedAt)}</span></div>
    <div class="detail-row"><span class="detail-row-label">Total</span><span class="detail-row-val" style="color:var(--gold-main);font-weight:700;">${fmt(o.orderValue)}</span></div>

    <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px;">
      <div style="font-family:'Cinzel',serif;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted2);margin-bottom:10px;">Items Ordered</div>
      ${items.map(i => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;">
          <span>${i.productName || '—'} <span style="color:var(--muted)">× ${i.quantity}</span></span>
          <span style="color:var(--gold-main);font-weight:700;">${fmt((i.priceAtOrderTime || 0) * (i.quantity || 1))}</span>
        </div>`).join('')}
    </div>
    <button class="btn btn-gold" style="width:100%;margin-top:20px;" onclick="closeOrderModal()">Close</button>`;

  document.getElementById('orderDetailModal').classList.add('open');
  lucide.createIcons();
}

function closeOrderModal() { document.getElementById('orderDetailModal').classList.remove('open'); }

// ==========================================
// 5. INIT
// ==========================================

async function refreshAll() {
  await Promise.all([
    loadSellers(), 
    loadPending(),
    loadAllProducts(),
    loadAdminOrders()
  ]); 
  toast('Data synchronized with server', 'info');
}

document.addEventListener('DOMContentLoaded', () => {
  refreshAll();
  lucide.createIcons();
});
</script>
