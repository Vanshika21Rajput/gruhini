<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruhini – Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap"
        rel="stylesheet">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royalBrown: '#2a160e',
                        royalGold: '#b45309',
                        cream: '#fffaf0',
                        errorRed: '#dc2626'
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Lato', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        body {
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-color: #fffaf0;
            user-select: none;
            -webkit-user-select: none;
        }

        input {
            user-select: text;
        }

        .split-left {
            width: 30%;
            background-color: #fffaf0;
            background-image: radial-gradient(#b45309 0.5px, transparent 0.5px), linear-gradient(to right, rgba(180, 83, 9, 0.05) 1px, transparent 1px);
            background-size: 20px 20px, 40px 100%;
            position: relative;
            border-right: 4px solid #b45309;
            z-index: 1;
        }

        .split-right {
            width: 70%;
            position: relative;
            background-color: #1a0f0a;
            background-image: url('background2.png');
            background-size: cover;
            background-position: center;
        }

        .split-right::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to left, rgba(26, 15, 10, 0.6), rgba(26, 15, 10, 0.9));
        }

        .split-right::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(30% 50% at 30% 60%, rgba(255, 255, 255, 0.1), transparent 60%);
            animation: steam 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes steam {
            0% {
                opacity: 0.3;
                transform: translateY(10px);
            }

            50% {
                opacity: 0.5;
                transform: translateY(-10px);
            }

            100% {
                opacity: 0.3;
                transform: translateY(10px);
            }
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translate(-50%, -48%) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .auth-container {
            position: absolute;
            top: 50%;
            left: 30%;
            transform: translate(-50%, -50%);
            width: 380px;
            background-color: #ffffff;
            border: 1px solid #e7d5c0;
            box-shadow: 0 0 0 4px #fffaf0, 0 30px 60px -15px rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            padding: 28px 32px;
            z-index: 10;
            animation: cardIn 0.5s ease-out;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            color: #1f2937;
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            transition: all 0.2s;
        }

        .input-group input:focus {
            border-color: #b45309;
            box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.1);
            outline: none;
        }

        #btn-submit:active {
            transform: scale(0.98);
        }

        #google-btn-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        #google-btn-wrapper>div {
            border-radius: 999px !important;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
        }

        @media(max-width: 900px) {
            .split-left {
                display: none;
            }

            .split-right {
                width: 100%;
            }

            .auth-container {
                left: 50%;
                width: 90%;
                max-width: 380px;
            }
        }
    </style>
</head>

<body>

    <aside class="split-left" aria-hidden="true"></aside>
    <div class="split-right" role="img" aria-label="Authentic Indian Kitchen"></div>

    <main class="auth-container">
        <div class="text-center mb-4">
            <div class="flex justify-center mb-3">
                <div class="w-16 h-16 rounded-full overflow-hidden shadow-lg border-2 border-royalGold/20">
                    <img src="public/logo.jpg" alt="Gruhini" class="w-full h-full object-cover">
                </div>
            </div>

            <h1 class="font-cinzel text-3xl text-royalBrown font-bold">Gruhini</h1>
            <p class="font-serif italic text-gray-500 text-xs mt-1">Ghar Jaisa Khana, Ghar Ke Log</p>
            <p id="page-title" class="font-sans text-[10px] font-bold text-gray-400 uppercase tracking-[0.15em] mt-2">
                Unlock the Kitchen</p>
        </div>

        <div id="success-section" class="hidden text-center py-4" role="alert">
            <div class="text-3xl mb-2">🍲</div>
            <h3 class="text-royalBrown font-cinzel text-lg font-bold">Welcome Home</h3>
            <p class="text-xs text-gray-500 mt-1">Setting your table...</p>
        </div>

        <div id="auth-section">
            <div id="google-btn-wrapper"></div>

            <div class="relative flex py-1 items-center mb-4">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink-0 mx-3 text-gray-400 text-[9px] font-bold uppercase tracking-widest">Or Login
                    With Email</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <div class="bg-gray-100 p-1 rounded-lg flex mb-4 relative border border-gray-200" role="group">
                <div id="glider"
                    class="absolute top-1 left-1 w-[calc(50%-4px)] h-[calc(100%-8px)] bg-white shadow-md rounded-md transition-transform duration-300 z-0 border border-gray-100">
                </div>
                <button type="button" onclick="AppState.setRole('customer')" id="btn-customer"
                    class="flex-1 py-2 text-[10px] font-bold uppercase tracking-wider relative z-10 text-royalBrown transition-colors">Customer</button>
                <button type="button" onclick="AppState.setRole('seller')" id="btn-seller"
                    class="flex-1 py-2 text-[10px] font-bold uppercase tracking-wider relative z-10 text-gray-400 transition-colors">Seller</button>
            </div>

            <form onsubmit="Handlers.handleAuth(event)" class="space-y-3" novalidate>
                <div id="extra-fields"></div>

                <div class="input-group">
                    <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required
                        autocomplete="current-password">
                </div>

                <p id="form-error" class="text-errorRed text-xs text-center font-bold hidden" role="alert"></p>

                <button id="btn-submit" type="submit"
                    class="w-full py-3 bg-gradient-to-r from-royalBrown to-[#4a2c20] text-white font-cinzel font-bold text-xs uppercase tracking-widest rounded-lg shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300 disabled:opacity-70">
                    Login
                </button>
            </form>

            <div class="text-center mt-4">
                <span id="footer-text" class="text-gray-500 text-xs">New to Gruhini?</span>
                <button type="button" onclick="AppState.toggleMode()" id="footer-link"
                    class="text-royalGold font-bold text-xs uppercase tracking-wide hover:underline ml-1">Create
                    Account</button>
            </div>
        </div>
    </main>

    <script>
        const CONFIG = {
            BASE_URL: window.CONFIG?.BASE_URL || 'http://localhost:8080',
            GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID_HERE"
        };

        const AppState = {
            view: 'login', role: 'customer', isLoading: false,
            setRole(newRole) { this.role = newRole; UI.updateRoleToggle(newRole); UI.renderForm(); UI.clearError(); },
            toggleMode() { this.view = this.view === 'login' ? 'register' : 'login'; UI.renderForm(); UI.clearError(); }
        };

        const UI = {
            updateRoleToggle(role) {
                const isSeller = role === 'seller';
                document.getElementById('glider').style.transform = isSeller ? 'translateX(100%)' : 'translateX(0)';
                document.getElementById('btn-customer').className = `flex-1 py-2 text-[10px] font-bold uppercase tracking-wider relative z-10 transition-colors ${isSeller ? 'text-gray-400' : 'text-royalBrown'}`;
                document.getElementById('btn-seller').className = `flex-1 py-2 text-[10px] font-bold uppercase tracking-wider relative z-10 transition-colors ${isSeller ? 'text-royalBrown' : 'text-gray-400'}`;
            },
            renderForm() {
                const isReg = AppState.view === 'register';
                const isSeller = AppState.role === 'seller';
                const extraDiv = document.getElementById('extra-fields');

                document.getElementById('page-title').innerText = isReg ? (isSeller ? "Join as a Chef" : "Join as a Foodie") : "Unlock the Kitchen";
                document.getElementById('btn-submit').innerText = isReg ? "Create Account" : "Login";
                document.getElementById('footer-text').innerText = isReg ? "Already registered?" : "New to Gruhini?";
                document.getElementById('footer-link').innerText = isReg ? "Login" : "Create Account";

                if (isReg) {
                    const ic = "w-full p-3 bg-white border border-gray-300 rounded-lg text-gray-800 focus:border-royalGold focus:outline-none text-sm";
                    let html = `<div class="input-group"><input type="text" id="name" placeholder="Full Name" required class="${ic}"></div>`;
                    html += `<div class="input-group mt-3"><input type="tel" id="contact" placeholder="Phone Number" required class="${ic}"></div>`;
                    if (isSeller) html += `<div class="input-group mt-3"><input type="text" id="businessName" placeholder="Kitchen Name" required class="${ic}"></div>`;
                    extraDiv.innerHTML = html;
                } else {
                    extraDiv.innerHTML = '';
                }
            },
            showError(msg) { const el = document.getElementById('form-error'); el.innerText = msg; el.classList.remove('hidden'); },
            clearError() { document.getElementById('form-error').classList.add('hidden'); },
            setLoading(loading) {
                AppState.isLoading = loading;
                const btn = document.getElementById('btn-submit');
                btn.innerHTML = loading ? `<span class="animate-pulse">Processing...</span>` : (AppState.view === 'register' ? "Create Account" : "Login");
                btn.disabled = loading;
            },
            showSuccessAndRedirect(role) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('success-section').classList.remove('hidden');
                setTimeout(() => {
                    const redirect = localStorage.getItem('redirectAfterLogin');
                    if (redirect) { localStorage.removeItem('redirectAfterLogin'); window.location.href = redirect; }
                    else { window.location.href = role === 'SELLER' ? 'sellers.html' : 'index.html'; }
                }, 1500);
            }
        };

        const Handlers = {
            async handleAuth(e) {
                e.preventDefault();
                if (AppState.isLoading) return;
                UI.clearError(); UI.setLoading(true);

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                try {
                    if (AppState.view === 'login') {
                        // LOGIN: /logins expects { email, password, name }
                        const res = await fetch(`${CONFIG.BASE_URL}/logins`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password, name: email })
                        });

                        if (!res.ok) {
                            const d = await res.json().catch(() => ({}));
                            throw new Error(d.message || 'Invalid email or password');
                        }

                        const data = await res.json();
                        localStorage.setItem('authToken', data.token);

                        try {
                            const p = JSON.parse(atob(data.token.split('.')[1]));
                            localStorage.setItem('userName', p.sub || email);
                            localStorage.setItem('userRole', p.roles?.includes('ROLE_SELLER') ? 'SELLER' : 'CUSTOMER');
                        } catch (e) {
                            localStorage.setItem('userName', email);
                            localStorage.setItem('userRole', 'CUSTOMER');
                        }
                        UI.showSuccessAndRedirect(localStorage.getItem('userRole'));

                    } else {
                        // REGISTER
                        const name = document.getElementById('name')?.value.trim();
                        const contact = document.getElementById('contact')?.value.trim();
                        if (!name || !contact) throw new Error('Please fill all fields');

                        // Step 1: Register user - /register expects { name, email, password, contact }
                        const regRes = await fetch(`${CONFIG.BASE_URL}/register`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name, email, password, contact })
                        });

                        if (!regRes.ok) {
                            const d = await regRes.json().catch(() => ({}));
                            throw new Error(d.message || 'Registration failed');
                        }

                        // Step 2: If seller, also call /register-seller
                        // sellerDto expects: { name, email, phone, businessName, categories }
                        if (AppState.role === 'seller') {
                            const businessName = document.getElementById('businessName')?.value.trim();
                            if (!businessName) throw new Error('Please enter kitchen name');

                            const sellerRes = await fetch(`${CONFIG.BASE_URL}/register-seller`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    name: name,
                                    email: email,
                                    phone: contact,
                                    businessName: businessName,
                                    categories: ['Home Cooked']
                                })
                            });

                            if (!sellerRes.ok) {
                                const d = await sellerRes.json().catch(() => ({}));
                                throw new Error(d.message || 'Seller registration failed');
                            }
                        }

                        // Step 3: Auto-login
                        const loginRes = await fetch(`${CONFIG.BASE_URL}/logins`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password, name: email })
                        });

                        if (loginRes.ok) {
                            const ld = await loginRes.json();
                            localStorage.setItem('authToken', ld.token);
                            localStorage.setItem('userName', name);
                            localStorage.setItem('userRole', AppState.role.toUpperCase());
                        }

                        UI.showSuccessAndRedirect(AppState.role.toUpperCase());
                    }
                } catch (err) {
                    console.error('Auth error:', err);
                    UI.showError(err.message || 'Something went wrong');
                    UI.setLoading(false);
                }
            },

            async handleGoogleResponse(response) {
                try {
                    const res = await fetch(`${CONFIG.BASE_URL}/google-login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: response.credential, role: AppState.role.toUpperCase() })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.message || "Google Login Failed");
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('userName', data.name);
                    UI.showSuccessAndRedirect(data.role);
                } catch (err) { UI.showError(err.message); }
            }
        };

        window.onload = function () {
            if (window.google) {
                google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: Handlers.handleGoogleResponse });
                google.accounts.id.renderButton(document.getElementById("google-btn-wrapper"), { theme: "outline", size: "large", width: "280", shape: "pill" });
            }
        }
    </script>
</body>

</html>
