<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruhini – Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/config.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royalBrown: '#2a160e',
                        royalGold: '#b45309',
                        cream: '#fffaf0',
                        errorRed: '#dc2626'
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Lato', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
        body { height: 100vh; display: flex; overflow: hidden; background-color: #fffaf0; user-select: none; }
        input { user-select: text; }

        /* SPLIT LAYOUT */
        .split-left {
            width: 30%;
            background-color: #fffaf0;
            background-image: radial-gradient(#b45309 0.5px, transparent 0.5px), linear-gradient(to right, rgba(180, 83, 9, 0.05) 1px, transparent 1px);
            background-size: 20px 20px, 40px 100%;
            border-right: 4px solid #b45309;
        }
        .split-right {
            width: 70%;
            position: relative;
            background-color: #1a0f0a;
            background-image: url('public/background.jpg'); /* Ensure image exists */
            background-size: cover;
            background-position: center;
        }
        .split-right::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to left, rgba(26, 15, 10, 0.6), rgba(26, 15, 10, 0.9)); }

        /* AUTH CARD */
        .auth-container {
            position: absolute; top: 50%; left: 30%; transform: translate(-50%, -50%); width: 420px;
            background-color: #ffffff; border: 1px solid #e7d5c0;
            box-shadow: 0 0 0 4px #fffaf0, 0 30px 60px -15px rgba(0, 0, 0, 0.6);
            border-radius: 20px; padding: 40px; z-index: 10;
            max-height: 90vh; overflow-y: auto; /* Allow scroll if form gets long */
        }
        .auth-container::-webkit-scrollbar { display: none; }

        /* INPUTS */
        .input-group input { width: 100%; padding: 12px 16px; background: #fff; border: 1px solid #d1d5db; border-radius: 10px; color: #1f2937; font-size: 14px; font-family: 'Lato', sans-serif; transition: all 0.2s; }
        .input-group input:focus { border-color: #b45309; box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.1); outline: none; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-up { animation: fadeInUp 0.3s ease-out forwards; }

        @media(max-width: 900px) { .split-left { display: none; } .split-right { width: 100%; } .auth-container { left: 50%; width: 90%; } }
    </style>
</head>

<body>

    <aside class="split-left"></aside>
    <div class="split-right"></div>

    <main class="auth-container">
        <div class="text-center mb-6">
            <h1 class="font-cinzel text-4xl text-royalBrown font-bold mb-1">Gruhini</h1>
            <p id="page-title" class="font-sans text-xs font-bold text-gray-500 uppercase tracking-[0.2em]">Unlock the Kitchen</p>
        </div>

        <div id="success-section" class="hidden text-center py-6 animate-up">
            <div class="text-4xl mb-3">🍲</div>
            <h3 class="text-royalBrown font-cinzel text-xl font-bold">Welcome Home</h3>
            <p class="text-xs text-gray-500 tracking-wide mt-2">Redirecting you now...</p>
        </div>

        <div id="auth-section">
            <div id="google-btn-wrapper" class="flex justify-center mb-6"></div>

            <div class="relative flex py-2 items-center mb-6">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink-0 mx-4 text-gray-400 text-[10px] font-bold uppercase tracking-widest">Or Continue With Email</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <div class="bg-gray-100 p-1 rounded-xl flex mb-6 relative border border-gray-200">
                <div id="glider" class="absolute top-1 left-1 w-[calc(50%-4px)] h-[calc(100%-8px)] bg-white shadow-md rounded-lg transition-transform duration-300 z-0"></div>
                <button type="button" onclick="AppState.setRole('customer')" id="btn-customer" class="flex-1 py-2.5 text-xs font-bold uppercase tracking-wider relative z-10 text-royalBrown transition-colors">Customer</button>
                <button type="button" onclick="AppState.setRole('seller')" id="btn-seller" class="flex-1 py-2.5 text-xs font-bold uppercase tracking-wider relative z-10 text-gray-400 transition-colors">Seller</button>
            </div>

            <form onsubmit="Handlers.handleAuth(event)" class="space-y-4">
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <div id="extra-fields"></div>

                <p id="form-error" class="text-errorRed text-xs text-center font-bold hidden"></p>

                <button id="btn-submit" type="submit" class="w-full py-3.5 mt-2 bg-gradient-to-r from-royalBrown to-[#4a2c20] text-white font-cinzel font-bold text-sm uppercase tracking-widest rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300">
                    Login
                </button>
            </form>

            <div class="text-center mt-6">
                <span id="footer-text" class="text-gray-500 text-xs">New to Gruhini?</span>
                <button type="button" onclick="AppState.toggleMode()" id="footer-link" class="text-royalGold font-bold text-xs uppercase tracking-wide hover:underline ml-1">Create Account</button>
            </div>
        </div>
    </main>

    <script>
        // Ensure Config Load
        const API_URL = (window.CONFIG && window.CONFIG.BASE_URL) ? window.CONFIG.BASE_URL : 'http://localhost:8080';

        const AppState = {
            view: 'login', role: 'customer', isLoading: false,
            
            setRole(newRole) { 
                this.role = newRole; 
                UI.updateRoleToggle(newRole); 
                UI.renderForm(); 
                UI.clearError(); 
            },
            toggleMode() { 
                this.view = this.view === 'login' ? 'register' : 'login'; 
                UI.renderForm(); 
                UI.clearError(); 
            }
        };

        const UI = {
            updateRoleToggle(role) {
                const isSeller = role === 'seller';
                document.getElementById('glider').style.transform = isSeller ? 'translateX(100%)' : 'translateX(0)';
                
                const cBtn = document.getElementById('btn-customer');
                const sBtn = document.getElementById('btn-seller');
                
                cBtn.className = isSeller ? 'flex-1 py-2.5 text-xs font-bold uppercase tracking-wider relative z-10 text-gray-400' : 'flex-1 py-2.5 text-xs font-bold uppercase tracking-wider relative z-10 text-royalBrown';
                sBtn.className = isSeller ? 'flex-1 py-2.5 text-xs font-bold uppercase tracking-wider relative z-10 text-royalBrown' : 'flex-1 py-2.5 text-xs font-bold uppercase tracking-wider relative z-10 text-gray-400';
            },
            renderForm() {
                const isRegister = AppState.view === 'register';
                const isSeller = AppState.role === 'seller';
                
                // Update Titles
                document.getElementById('page-title').innerText = isRegister ? (isSeller ? "Join as Chef" : "Join Gruhini") : "Unlock the Kitchen";
                document.getElementById('btn-submit').innerText = isRegister ? "Create Account" : "Login";
                document.getElementById('footer-text').innerText = isRegister ? "Already have an account?" : "New to Gruhini?";
                document.getElementById('footer-link').innerText = isRegister ? "Login" : "Create Account";

                const extraDiv = document.getElementById('extra-fields');
                
                if (isRegister) {
                    let html = `
                        <div class="input-group animate-up mt-4">
                            <input type="text" id="name" placeholder="Full Name" required>
                        </div>
                        <div class="input-group animate-up mt-4">
                            <input type="tel" id="contact" placeholder="Phone Number" required>
                        </div>
                    `;
                    
                    // Seller Specific Fields
                    if (isSeller) {
                        html += `
                            <div class="input-group animate-up mt-4">
                                <input type="text" id="businessName" placeholder="Kitchen/Business Name" required>
                            </div>
                            <div class="input-group animate-up mt-4">
                                <input type="text" id="categories" placeholder="Categories (e.g. Thalis, Snacks)" required>
                            </div>
                            <p class="text-[10px] text-gray-400 mt-1 pl-1 animate-up">* Separate categories with commas</p>
                        `;
                    }
                    extraDiv.innerHTML = html;
                } else {
                    extraDiv.innerHTML = ''; // Clear fields for login
                }
            },
            showError(msg) { 
                const el = document.getElementById('form-error'); 
                el.innerText = msg; 
                el.classList.remove('hidden'); 
            },
            clearError() { 
                document.getElementById('form-error').classList.add('hidden'); 
            },
            setLoading(loading) {
                AppState.isLoading = loading;
                const btn = document.getElementById('btn-submit');
                if (loading) { 
                    btn.innerHTML = `<span class="animate-pulse">Processing...</span>`; 
                    btn.disabled = true; 
                } else { 
                    btn.innerText = AppState.view === 'register' ? "Create Account" : "Login"; 
                    btn.disabled = false; 
                }
            },
            showSuccessAndRedirect(role) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('success-section').classList.remove('hidden');
                setTimeout(() => { 
                    // Redirect based on role
                    window.location.href = (role === 'SELLER' || AppState.role === 'seller') ? 'seller-dashboard.html' : 'index.html'; 
                }, 1500);
            }
        };

        const Handlers = {
            async handleAuth(e) {
                e.preventDefault();
                if (AppState.isLoading) return;
                UI.clearError(); 
                UI.setLoading(true);

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                try {
                    let endpoint, body;

                    // 1. LOGIN LOGIC
                    if (AppState.view === 'login') {
                        endpoint = '/logins';
                        // Backend DTO requires name/contact even for login, sending empty strings
                        body = {
                            email: email,
                            password: password,
                            name: "",
                            contact: "" 
                        };
                    } 
                    // 2. SELLER REGISTRATION
                    else if (AppState.role === 'seller') {
                        endpoint = '/register-seller';
                        
                        const name = document.getElementById('name').value;
                        const contact = document.getElementById('contact').value;
                        const bizName = document.getElementById('businessName').value;
                        const cats = document.getElementById('categories').value;
                        
                        // Convert "A, B" string to Array ["A", "B"]
                        const catArray = cats.split(',').map(s => s.trim()).filter(s => s.length > 0);

                        body = {
                            name: name,
                            email: email,
                            phone: contact, // Backend expects 'phone' for seller
                            businessName: bizName,
                            categories: catArray,
                            password: password
                        };
                    } 
                    // 3. CUSTOMER REGISTRATION
                    else {
                        endpoint = '/register';
                        body = {
                            name: document.getElementById('name').value,
                            email: email,
                            contact: document.getElementById('contact').value, // Backend expects 'contact' for user
                            password: password
                        };
                    }

                    console.log("Sending payload to:", endpoint, body);

                    const res = await fetch(`${API_URL}${endpoint}`, {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    
                    const data = await res.json();
                    
                    if (!res.ok) throw new Error(data.message || 'Authentication Failed');

                    // Store Session Data
                    if(data.token) localStorage.setItem('authToken', data.token);
                    if(data.role) localStorage.setItem('userRole', data.role);
                    if(data.name) localStorage.setItem('userName', data.name);
                    
                    UI.showSuccessAndRedirect(data.role || AppState.role.toUpperCase());

                } catch (err) { 
                    UI.showError(err.message); 
                    UI.setLoading(false);
                }
            },
            
            // Optional: Keep Google Handler structure
            async handleGoogleResponse(response) {
                // Implementation for Google Login if enabled on backend
            }
        };
        
        // Initialize
        window.onload = function() {
            UI.renderForm(); // Initial render
            if(window.google) {
                google.accounts.id.initialize({ client_id: "YOUR_GOOGLE_ID", callback: Handlers.handleGoogleResponse });
                google.accounts.id.renderButton(document.getElementById("google-btn-wrapper"), { theme: "outline", size: "large", width: "320" });
            }
        }
    </script>
</body>
</html>
