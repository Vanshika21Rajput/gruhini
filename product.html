<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Dish Details - Gruhini</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        gold: { main: '#c5a059', hover: '#e2b091' }, 
                        brown: '#2a160e', 
                        paper: '#F9F5EA', 
                        royalDark: '#1a0f0a' 
                    }, 
                    fontFamily: { 
                        cinzel: ['Cinzel', 'serif'], 
                        serif: ['Playfair Display', 'serif'], 
                        sans: ['Lato', 'sans-serif'] 
                    } 
                } 
            } 
        }
    </script>
    <script src="js/config.js"></script>
    <style>
        /* Restored the Light Paper Texture */
        body { background-color: #F9F5EA; color: #2a160e; }
        .paper-texture {
            background-image: url('public/parchment.jpg');
            background-blend-mode: multiply;
            background-size: cover;
        }
        /* Smooth Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c5a059; border-radius: 10px; }
    </style>
</head>
<body class="antialiased min-h-screen paper-texture selection:bg-gold-main/30">

    <nav class="fixed top-0 w-full z-50 bg-[#1a0f0a] border-b border-gold/30 px-6 py-4 flex justify-between items-center shadow-xl">
        
        <a href="index.html" class="flex items-center gap-3 group">
            <div class="w-12 h-12 rounded-full overflow-hidden relative shadow-[0_0_15px_rgba(197,160,89,0.4)] group-hover:shadow-[0_0_25px_rgba(197,160,89,0.6)] transition-all duration-500">
                <img src="public/logo.jpg" alt="Gruhini" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700">
                <div class="absolute inset-0 bg-gradient-to-tr from-black/10 to-transparent pointer-events-none"></div>
            </div>
            <span class="font-cinzel text-xl font-bold text-gold-main tracking-widest group-hover:text-white transition-colors duration-300">GRUHINI</span>
        </a>

        <div class="flex items-center gap-6">
            <a href="menu.html" class="hidden md:block text-xs font-bold uppercase tracking-widest text-gray-400 hover:text-gold-main transition-colors">Menu</a>
            <a href="cart.html" class="text-xs font-bold uppercase tracking-widest text-gray-400 hover:text-gold-main transition-colors">Cart 🛒</a>
            <a href="#" onclick="window.close()" class="text-xs font-bold uppercase tracking-widest text-red-400 border border-red-900/50 px-4 py-1.5 rounded-full hover:bg-red-900/20 transition-all">Close</a>
        </div>

    </nav>

    <div id="loading" class="fixed inset-0 flex items-center justify-center bg-[#F9F5EA] z-[60]">
        <div class="text-center animate-pulse">
            <div class="text-4xl mb-4 text-gold-main">🥘</div>
            <p id="loadingText" class="font-cinzel tracking-widest text-sm text-brown">Entering the Kitchen...</p>
        </div>
    </div>

    <div id="content" class="hidden min-h-screen flex flex-col lg:flex-row pt-16">
        
        <div class="w-full lg:w-1/2 h-[50vh] lg:h-[calc(100vh-64px)] lg:sticky lg:top-16 relative overflow-hidden bg-black shadow-2xl">
            <img id="heroImg" class="w-full h-full object-cover transition-transform duration-[3s] hover:scale-105">
            <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black/90 via-black/50 to-transparent p-8 lg:hidden">
                <h1 id="mobTitle" class="font-serif text-3xl text-white font-bold leading-tight drop-shadow-md">--</h1>
                <p id="mobPrice" class="font-cinzel text-gold-main text-xl mt-2 font-bold">--</p>
            </div>
        </div>

        <div class="w-full lg:w-1/2 px-6 lg:px-20 py-12 lg:py-16 overflow-y-auto">
            
            <div class="flex items-center gap-5 mb-10 border-b border-brown/10 pb-8">
                <img id="chefAvatar" class="w-16 h-16 rounded-full border-2 border-brown/10 p-1 object-cover shadow-sm">
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-[0.2em] mb-1">Kitchen of</p>
                    <h3 id="chefName" class="font-cinzel text-xl font-bold text-brown">--</h3>
                    <p id="chefLoc" class="text-xs text-gold-main font-bold italic mt-0.5">--</p>
                </div>
            </div>

            <div class="hidden lg:block mb-8">
                <h1 id="pTitle" class="font-serif text-5xl xl:text-6xl text-brown font-bold leading-[1.1] mb-6">--</h1>
                <div class="flex items-center justify-between">
                    <p id="deskPrice" class="font-cinzel text-4xl text-brown font-bold">--</p>
                    <div class="flex gap-3">
                        <span id="trustStat" class="px-4 py-1.5 bg-brown/5 text-brown text-[10px] font-bold uppercase tracking-wider rounded-full">--</span>
                        <span id="timeStat" class="px-4 py-1.5 bg-gold/10 text-gold-main text-[10px] font-bold uppercase tracking-wider rounded-full border border-gold/20">--</span>
                    </div>
                </div>
            </div>

            <div class="bg-white p-8 rounded-2xl shadow-sm border border-brown/5 mb-10 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-gold-main"></div>
                <h4 class="font-cinzel text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">The Story</h4>
                <p id="pDesc" class="font-serif text-lg leading-loose text-gray-700 italic">--</p>
            </div>

            <div class="mb-10">
                <h4 class="font-cinzel text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Key Ingredients</h4>
                <div id="ingredientsGrid" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="bg-[#F0EAD6] p-5 rounded-xl border border-brown/5 mb-12 flex items-center gap-4 shadow-inner">
                <div class="w-12 h-12 bg-brown text-paper rounded-full flex items-center justify-center text-lg shadow-md shrink-0">▶</div>
                <div class="flex-1 min-w-0">
                    <p class="text-[10px] uppercase tracking-widest text-gray-500 mb-0.5">Chef's Voice</p>
                    <p class="font-serif text-brown italic text-sm truncate">"Hear the story behind this dish"</p>
                </div>
                <audio id="audioPlayer" class="w-24 h-8 opacity-50 hover:opacity-100 transition-opacity" controls></audio>
            </div>

            <div class="sticky bottom-6 z-30">
                <button onclick="addToCart()" id="btn-add" class="w-full bg-gradient-to-r from-brown to-[#4a2c20] text-paper py-5 rounded-xl font-cinzel font-bold text-sm tracking-[0.3em] uppercase shadow-2xl hover:shadow-[0_10px_30px_rgba(42,22,14,0.4)] hover:-translate-y-1 transition-all flex justify-center items-center gap-3">
                    Add to Plate
                </button>
            </div>

            <div class="mt-20 pt-10 border-t border-brown/10">
                <h3 class="font-cinzel text-brown mb-8 text-lg tracking-widest flex items-center gap-3">
                    <span class="w-8 h-[1px] bg-gold-main"></span> You May Also Like
                </h3>
                <div id="suggestionsList" class="flex flex-col gap-4">
                    </div>
            </div>

        </div>
    </div>

    <script>
        const pid = new URLSearchParams(window.location.search).get('id');
        let currentItem = null, allItems = [];

        // 🚨 FIX: Image Path Fixer
        function getImgPath(path) {
            if (!path) return window.CONFIG.PLACEHOLDER;
            if (path.startsWith('http') || path.startsWith('public/')) return path;
            return `public/${path}`;
        }

        // 🚨 FIX: Price Formatter
        function formatPrice(priceVal) {
            const num = Number(String(priceVal).replace(/[^0-9.]/g, '')) || 0;
            return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0 }).format(num);
        }

        async function init() {
            try {
                if (!pid) throw new Error("No Product ID");

                try { 
                    const controller = new AbortController();
                    setTimeout(() => controller.abort(), 4000);
                    const res = await fetch(`${window.CONFIG.BASE_URL}/explore`, { signal: controller.signal });
                    if(res.ok) allItems = await res.json();
                    else throw new Error();
                } catch(e) {
                    try {
                        const localRes = await fetch('real-products.json');
                        allItems = await localRes.json();
                    } catch(err) { throw new Error("Data Missing"); }
                }
                
                currentItem = allItems.find(i => String(i.id) === String(pid));
                
                if(currentItem) { 
                    render(currentItem); 
                    renderSuggestions(currentItem.category || "Meals"); 
                } else {
                    throw new Error("Dish Not Found");
                }

            } catch(e) { 
                document.getElementById('loadingText').innerText = "Unavailable";
                document.getElementById('loadingText').classList.add('text-red-500');
            }
        }

        function render(item) {
            document.getElementById('heroImg').src = getImgPath(item.img || item.image);
            document.getElementById('chefAvatar').src = getImgPath(item.avatar);
            
            document.getElementById('pTitle').innerText = item.title || item.name;
            document.getElementById('mobTitle').innerText = item.title || item.name;
            document.getElementById('chefName').innerText = item.chef || "Home Chef";
            document.getElementById('chefLoc').innerText = item.loc || "Kitchen";
            document.getElementById('pDesc').innerText = item.desc || item.description;
            document.getElementById('trustStat').innerText = item.trustStat || "Authentic";
            document.getElementById('timeStat').innerText = item.time || "Fresh";

            const formattedPrice = formatPrice(item.price);
            document.getElementById('deskPrice').innerText = formattedPrice;
            document.getElementById('mobPrice').innerText = formattedPrice;

            document.getElementById('audioPlayer').src = item.audio || "";

            // Dynamic Ingredients
            const ings = (item.ingredients && item.ingredients.length > 0) 
                ? item.ingredients 
                : ["Authentic Recipe", "No Preservatives", "Handmade"];

            document.getElementById('ingredientsGrid').innerHTML = ings.map(i => `
                <span class="px-4 py-2 bg-white border border-gold/20 rounded-lg text-xs font-bold text-brown shadow-sm uppercase tracking-wider hover:border-gold/60 transition-colors cursor-default">
                    ${i}
                </span>
            `).join('');

            document.getElementById('loading').classList.add('hidden'); 
            document.getElementById('content').classList.remove('hidden');
        }

        function renderSuggestions(cat) {
            const suggestions = allItems
                .filter(i => (i.category || "Meals") === cat && String(i.id) !== String(pid))
                .slice(0, 5);
                
            const list = suggestions.length > 0 ? suggestions : allItems.slice(0, 3);
            
            document.getElementById('suggestionsList').innerHTML = list.map(s => `
                <div class="group flex items-center gap-4 bg-white p-3 rounded-xl border border-brown/5 hover:border-gold/30 hover:shadow-lg transition-all cursor-pointer" onclick="window.open('product.html?id=${s.id}', '_self')">
                    <div class="w-20 h-20 rounded-lg overflow-hidden shrink-0">
                        <img src="${getImgPath(s.img || s.image)}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h5 class="font-cinzel text-sm font-bold text-brown truncate group-hover:text-gold-main transition-colors">${s.title||s.name}</h5>
                        <p class="text-[10px] text-gray-500 uppercase tracking-wider mt-0.5">By ${s.chef || 'Home Chef'}</p>
                        <p class="text-xs font-bold text-brown mt-2">${formatPrice(s.price)}</p>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-paper flex items-center justify-center text-brown group-hover:bg-gold-main group-hover:text-white transition-colors">
                        ➝
                    </div>
                </div>`).join('');
        }

        async function addToCart() {
            const token = localStorage.getItem('authToken');
            if(!token) { localStorage.setItem('redirectAfterLogin', window.location.href); window.location.href = 'login.html'; return; }
            
            const btn = document.getElementById('btn-add');
            btn.innerHTML = "Adding...";
            
            try { 
                await fetch(`${window.CONFIG.BASE_URL}/add-to-cart`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, 
                    body: JSON.stringify({ productid: currentItem.id, quantity: 1 }) 
                });
                btn.innerHTML = "Added to Plate ✓"; 
                btn.style.background = "#22c55e"; // Green
                setTimeout(() => window.location.href = 'cart.html', 800); 
            } catch(e) { 
                btn.innerHTML = "Try Again"; 
            }
        }

        init();
    </script>
</body>
</html>
