<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites - Gruhini</title>
    <!-- Preload critical assets -->
    <link rel="preload" href="public/background.jpg" as="image" type="image/jpeg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap"
        rel="stylesheet">
    <!-- Professional Vector Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/config.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { main: '#c5a059', matte: '#8c6a38', rose: '#e2b091' },
                        royal: { dark: '#0f0805', brown: '#1a0f0a' }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Lato', 'sans-serif'],
                        hindi: ['Noto Sans Devanagari', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f0805;
            color: #fff;
            overflow-x: hidden;
        }

        .hero-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: url('public/background.jpg') center/cover no-repeat;
            opacity: 0.35;
        }

        .hero-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(to bottom, rgba(5, 2, 1, 0.4), #0f0805);
        }

        .glass {
            background: rgba(15, 8, 5, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(197, 160, 89, 0.15);
        }

        .nav-glass {
            background: rgba(5, 2, 1, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
        }
    </style>
</head>

<body class="min-h-screen pb-20">
    <!-- Hero Background -->
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>

    <!-- Navbar -->
    <nav
        class="fixed top-0 w-full z-40 px-6 py-4 flex justify-between items-center nav-glass transition-all duration-300">
        <a href="index.html" class="flex items-center gap-3 group">
            <div
                class="w-10 h-10 rounded-full overflow-hidden relative shadow-[0_0_15px_rgba(197,160,89,0.4)] group-hover:shadow-[0_0_25px_rgba(197,160,89,0.6)] transition-all duration-500 border border-gold-main/30">
                <img src="public/logo.jpg" alt="Gruhini"
                    class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700">
            </div>
            <span
                class="font-cinzel text-xl font-bold text-gold-main tracking-widest drop-shadow-md group-hover:text-white transition-colors">GRUHINI</span>
        </a>

        <div class="flex items-center gap-6">
            <a href="menu.html"
                class="text-xs font-bold text-gold-main/80 hover:text-white uppercase tracking-widest transition-colors">Menu</a>
            <a href="cart.html"
                class="text-xs font-bold text-gold-main/80 hover:text-white uppercase tracking-widest transition-colors flex items-center gap-1">
                Cart <span id="cartCountBadge"
                    class="hidden bg-red-600 text-white text-[8px] w-4 h-4 flex items-center justify-center rounded-full">0</span>
            </a>
        </div>
    </nav>

    <!-- Header -->
    <div class="pt-32 px-6 max-w-6xl mx-auto mb-8 flex justify-between items-end">
        <div>
            <h1 class="font-cinzel text-3xl md:text-4xl text-gold-main mb-2 tracking-wide drop-shadow-lg">My Favorites
            </h1>
            <p class="text-gray-300 text-sm font-sans tracking-wide">The dishes you hold dear.</p>
        </div>
        <div class="hidden md:block animate-bounce">
            <i data-lucide="heart" class="w-10 h-10 text-white/20"></i>
        </div>
    </div>

    <!-- Favorites Grid -->
    <div id="favoritesContainer" class="px-6 max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Loading -->
        <div class="col-span-full text-center py-20">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-gold-main"></div>
            <p class="mt-4 text-gray-400 font-cinzel text-sm animate-pulse">Gathering your favorites...</p>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('authToken');
        if (!token) window.location.href = 'login.html';

        // Cart Badge
        fetch(`${window.CONFIG.BASE_URL}/get-cart`, {
            headers: { 'Authorization': `Bearer ${token}` }
        }).then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    const badge = document.getElementById('cartCountBadge');
                    badge.innerText = data.length;
                    badge.classList.remove('hidden');
                }
            }).catch(() => { });

        async function loadFavorites() {
            try {
                const res = await fetch(`${window.CONFIG.BASE_URL}/get-favorites`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error('Failed to load favorites');

                const items = await res.json();
                const container = document.getElementById('favoritesContainer');

                if (items.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-20 glass rounded-2xl border border-white/5">
                            <div class="w-20 h-20 rounded-full bg-white/5 flex items-center justify-center mx-auto mb-6"><i data-lucide="heart" class="w-10 h-10 text-gray-500"></i></div>
                            <h2 class="text-xl text-gold-main font-cinzel mb-2">No Favorites Yet</h2>
                            <p class="text-gray-400 font-sans text-sm mb-6 max-w-xs mx-auto">Explore our menu and tap the heart icon to save dishes you love.</p>
                            <a href="menu.html" class="inline-block px-8 py-3 bg-gradient-to-r from-gold-matte to-gold-main text-black font-bold text-xs uppercase tracking-widest rounded-full hover:scale-105 transition-transform shadow-lg shadow-gold-main/20">Explore Menu</a>
                        </div>
                    `;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                    return;
                }

                container.innerHTML = items.map(item => `
                    <div class="glass p-0 rounded-2xl overflow-hidden group hover:border-gold-main/40 transition-all duration-300">
                        <div class="h-48 overflow-hidden relative" onclick="window.location.href='menu.html'">
                            <img src="${item.dishImage || 'public/placeholder.jpg'}" alt="${item.dishName}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                                <span class="bg-black/60 text-white px-4 py-2 rounded-full text-xs uppercase font-bold tracking-widest backdrop-blur-sm border border-white/20">View Menu</span>
                            </div>
                        </div>
                        <div class="p-5 relative">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-lg text-white font-cinzel leading-tight pr-6">${item.dishName}</h3>
                                <div class="text-gold-main font-bold font-cinzel whitespace-nowrap">₹${item.dishPrice}</div>
                            </div>
                            <p class="text-xs text-gold-rose mb-4 uppercase tracking-wider font-bold">By ${item.chefName}</p>
                            
                            <button onclick="removeFavorite('${item.dishId}', this)" class="w-full py-2 bg-white/5 hover:bg-red-500/10 border border-white/10 hover:border-red-500/30 text-gray-300 hover:text-red-400 rounded-lg text-xs uppercase font-bold tracking-widest transition-all flex items-center justify-center gap-2">
                                <i data-lucide="x" class="w-3 h-3"></i> Remove
                            </button>
                        </div>
                    </div>
                `).join('');

            } catch (e) {
                console.error(e);
                document.getElementById('favoritesContainer').innerHTML = `
                    <div class="col-span-full text-center text-red-300 py-10 bg-red-900/10 rounded-xl border border-red-500/20">
                        <p class="font-cinzel">Could not load favorites.</p>
                        <button onclick="location.reload()" class="underline text-xs mt-2 text-red-200 hover:text-white">Retry</button>
                    </div>
                `;
            }
        }

        async function removeFavorite(dishId, btn) {
            if (!confirm('Remove this dish from your collection?')) return;

            try {
                // Change button state
                const originalText = btn.innerHTML;
                btn.innerHTML = 'Removing...';

                await fetch(`${window.CONFIG.BASE_URL}/remove-favorite`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ dishId })
                });

                // Fade out and remove
                const card = btn.closest('.glass');
                card.style.transition = 'all 0.5s ease';
                card.style.opacity = '0';
                card.style.transform = 'scale(0.9)';

                setTimeout(() => {
                    card.remove();
                    // Check if empty
                    if (document.querySelectorAll('#favoritesContainer .glass').length === 0) {
                        loadFavorites(); // Reload to show empty state
                    }
                }, 500);

            } catch (e) {
                alert('Failed to remove');
                btn.innerHTML = originalText;
            }
        }

        loadFavorites();
    </script>

    <!-- Initialize Lucide Icons -->
    <script>if (typeof lucide !== 'undefined') lucide.createIcons();</script>
</body>

</html>
