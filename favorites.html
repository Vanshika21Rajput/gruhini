<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites - Gruhini</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/config.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { main: '#c5a059', matte: '#8c6a38' },
                        royal: { dark: '#0f0805', brown: '#1a0f0a' }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Lato', 'sans-serif'],
                        hindi: ['Noto Sans Devanagari', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f0805;
            color: #fff;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="min-h-screen pb-20">
    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-40 px-6 py-4 flex justify-between items-center glass border-b border-gold-main/20">
        <a href="index.html" class="font-cinzel text-xl text-gold-main font-bold tracking-widest">GRUHINI</a>
        <div id="navLinks" class="flex gap-4">
            <a href="menu.html"
                class="text-xs font-bold text-gray-300 hover:text-gold-main uppercase tracking-wider">Menu</a>
            <a href="cart.html"
                class="text-xs font-bold text-gray-300 hover:text-gold-main uppercase tracking-wider">Cart</a>
        </div>
    </nav>

    <!-- Header -->
    <div class="pt-32 px-6 max-w-6xl mx-auto mb-8">
        <h1 class="font-cinzel text-3xl text-gold-main mb-2">My Favorites</h1>
        <p class="text-gray-400 text-sm">Dishes you love.</p>
    </div>

    <!-- Favorites Grid -->
    <div id="favoritesContainer" class="px-6 max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Loading -->
        <div class="col-span-full text-center py-10 text-gray-400 animate-pulse">Loading favorites...</div>
    </div>

    <script>
        const token = localStorage.getItem('authToken');
        if (!token) window.location.href = 'login.html';

        async function loadFavorites() {
            try {
                const res = await fetch(`${window.CONFIG.BASE_URL}/get-favorites`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error('Failed to load favorites');

                const items = await res.json();
                const container = document.getElementById('favoritesContainer');

                if (items.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-20 bg-royal-brown/50 rounded-2xl border border-white/5">
                            <div class="text-4xl mb-4">❤️</div>
                            <p class="text-gray-400 font-cinzel text-lg mb-4">No favorites yet</p>
                            <a href="menu.html" class="inline-block px-6 py-2 bg-gold-main text-black font-bold text-xs uppercase tracking-widest rounded-full hover:bg-white transition-colors">Explore Menu</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = items.map(item => `
                    <div class="glass p-4 rounded-2xl flex gap-4 relative group">
                        <img src="${item.dishImage}" alt="${item.dishName}" class="w-24 h-24 rounded-xl object-cover">
                        <div class="flex-1">
                            <h3 class="font-bold text-white mb-1">${item.dishName}</h3>
                            <p class="text-xs text-gray-400 mb-2">by ${item.chefName}</p>
                            <div class="text-gold-main font-bold">₹${item.dishPrice}</div>
                        </div>
                        <button onclick="removeFavorite('${item.dishId}', this)" class="absolute top-4 right-4 text-red-500 hover:text-red-400">
                            ❤️
                        </button>
                    </div>
                `).join('');

            } catch (e) {
                console.error(e);
                document.getElementById('favoritesContainer').innerHTML = `
                    <div class="col-span-full text-center text-red-400 py-10">
                        Error loading favorites. <button onclick="location.reload()" class="underline">Retry</button>
                    </div>
                `;
            }
        }

        async function removeFavorite(dishId, btn) {
            if (!confirm('Remove from favorites?')) return;

            try {
                await fetch(`${window.CONFIG.BASE_URL}/remove-favorite`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ dishId })
                });
                // Remove from UI
                btn.closest('.glass').remove();

                // If empty, reload to show empty state
                if (document.querySelectorAll('#favoritesContainer .glass').length === 0) {
                    loadFavorites();
                }
            } catch (e) {
                alert('Failed to remove');
            }
        }

        loadFavorites();
    </script>
</body>

</html>
