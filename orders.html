<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Gruhini</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/config.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { main: '#c5a059', matte: '#8c6a38' },
                        royal: { dark: '#0f0805', brown: '#1a0f0a' }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Lato', 'sans-serif'],
                        hindi: ['Noto Sans Devanagari', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f0805; color: #fff; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen pb-20">
    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-40 px-6 py-4 flex justify-between items-center glass border-b border-gold-main/20">
        <a href="index.html" class="font-cinzel text-xl text-gold-main font-bold tracking-widest">GRUHINI</a>
        <div id="navLinks" class="flex gap-4">
            <a href="menu.html" class="text-xs font-bold text-gray-300 hover:text-gold-main uppercase tracking-wider">Menu</a>
            <a href="cart.html" class="text-xs font-bold text-gray-300 hover:text-gold-main uppercase tracking-wider">Cart</a>
        </div>
    </nav>

    <!-- Header -->
    <div class="pt-32 px-6 max-w-4xl mx-auto mb-8">
        <h1 class="font-cinzel text-3xl text-gold-main mb-2">Previous Orders</h1>
        <p class="text-gray-400 text-sm">Your culinary journey with us.</p>
    </div>

    <!-- Orders List -->
    <div id="ordersContainer" class="px-6 max-w-4xl mx-auto flex flex-col gap-6">
        <!-- Loading -->
        <div class="text-center py-10 text-gray-400 animate-pulse">Loading orders...</div>
    </div>

    <script>
        const token = localStorage.getItem('authToken');
        if (!token) window.location.href = 'login.html';

        async function loadOrders() {
            try {
                const res = await fetch(`${window.CONFIG.BASE_URL}/get-orders`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) throw new Error('Failed to load orders');
                
                const orders = await res.json();
                const container = document.getElementById('ordersContainer');
                
                if (orders.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-20 bg-royal-brown/50 rounded-2xl border border-white/5">
                            <div class="text-4xl mb-4">🍽️</div>
                            <p class="text-gray-400 font-cinzel text-lg mb-4">No orders yet</p>
                            <a href="menu.html" class="inline-block px-6 py-2 bg-gold-main text-black font-bold text-xs uppercase tracking-widest rounded-full hover:bg-white transition-colors">Order Now</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = orders.reverse().map(order => `
                    <div class="glass p-6 rounded-2xl flex flex-col md:flex-row justify-between md:items-center gap-6">
                        <div>
                            <div class="flex items-center gap-3 mb-2">
                                <span class="text-xs font-bold text-gold-main uppercase tracking-widest">Order #${order.id}</span>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${getStatusColor(order.status)} text-black">
                                    ${order.status}
                                </span>
                            </div>
                            <h3 class="font-cinzel text-lg text-white mb-1">${new Date(order.orderDate).toLocaleDateString()}</h3>
                            <p class="text-gray-400 text-sm mb-1">Kitchen: <span class="text-gray-200">${order.chefName || 'Home Kitchen'}</span></p>
                            <p class="text-gray-500 text-xs italic">${order.items || 'Delicious Meal'}</p>
                        </div>
                        <div class="text-right">
                             <div class="text-2xl font-cinzel text-gold-main">₹${order.amount || '0'}</div>
                             <div class="text-[10px] text-gray-500 uppercase tracking-widest mt-1">Paid via Razorpay</div>
                        </div>
                    </div>
                `).join('');
                
            } catch (e) {
                console.error(e);
                document.getElementById('ordersContainer').innerHTML = `
                    <div class="text-center text-red-400 py-10">
                        Could not load orders. <button onclick="location.reload()" class="underline">Retry</button>
                    </div>
                `;
            }
        }

        function getStatusColor(status) {
            switch(status?.toLowerCase()) {
                case 'delivered': return 'bg-green-400';
                case 'preparing': return 'bg-yellow-400';
                case 'placed': return 'bg-blue-400';
                default: return 'bg-gray-400';
            }
        }

        loadOrders();
    </script>
</body>
</html>
