<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Gruhini</title>
    <!-- Preload critical assets -->
    <link rel="preload" href="public/background.jpg" as="image" type="image/jpeg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap"
        rel="stylesheet">
    <!-- Professional Vector Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/config.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { main: '#c5a059', matte: '#8c6a38', rose: '#e2b091' },
                        royal: { dark: '#0f0805', brown: '#1a0f0a' }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Lato', 'sans-serif'],
                        hindi: ['Noto Sans Devanagari', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f0805;
            color: #fff;
            overflow-x: hidden;
        }

        .hero-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: url('public/background.jpg') center/cover no-repeat;
            opacity: 0.35;
            /* Darker overlay for readability on inner pages */
        }

        .hero-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(to bottom, rgba(5, 2, 1, 0.4), #0f0805);
        }

        .glass {
            background: rgba(15, 8, 5, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(197, 160, 89, 0.15);
        }

        .nav-glass {
            background: rgba(5, 2, 1, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
        }
    </style>
</head>

<body class="min-h-screen pb-20">
    <!-- Hero Background -->
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>

    <!-- Navbar -->
    <nav
        class="fixed top-0 w-full z-40 px-6 py-4 flex justify-between items-center nav-glass transition-all duration-300">
        <a href="index.html" class="flex items-center gap-3 group">
            <div
                class="w-10 h-10 rounded-full overflow-hidden relative shadow-[0_0_15px_rgba(197,160,89,0.4)] group-hover:shadow-[0_0_25px_rgba(197,160,89,0.6)] transition-all duration-500 border border-gold-main/30">
                <img src="public/logo.jpg" alt="Gruhini"
                    class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700">
            </div>
            <span
                class="font-cinzel text-xl font-bold text-gold-main tracking-widest drop-shadow-md group-hover:text-white transition-colors">GRUHINI</span>
        </a>

        <div class="flex items-center gap-6">
            <a href="menu.html"
                class="text-xs font-bold text-gold-main/80 hover:text-white uppercase tracking-widest transition-colors">Menu</a>
            <a href="cart.html"
                class="text-xs font-bold text-gold-main/80 hover:text-white uppercase tracking-widest transition-colors flex items-center gap-1">
                Cart <span id="cartCountBadge"
                    class="hidden bg-red-600 text-white text-[8px] w-4 h-4 flex items-center justify-center rounded-full">0</span>
            </a>
            <button onclick="window.history.back()"
                class="text-xs font-bold text-gold-matte hover:text-gold-main uppercase tracking-widest transition-colors">Back</button>
        </div>
    </nav>

    <!-- Header -->
    <div class="pt-32 px-6 max-w-4xl mx-auto mb-8">
        <h1 class="font-cinzel text-3xl md:text-4xl text-gold-main mb-2 tracking-wide drop-shadow-lg">Previous Orders
        </h1>
        <p class="text-gray-300 text-sm font-sans tracking-wide">Your culinary journey with select home kitchens.</p>
    </div>

    <!-- Orders List -->
    <div id="ordersContainer" class="px-6 max-w-4xl mx-auto flex flex-col gap-6">
        <!-- Loading -->
        <div class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-gold-main"></div>
            <p class="mt-4 text-gray-400 font-cinzel text-sm animate-pulse">Retrieving your royal records...</p>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('authToken');
        if (!token) window.location.href = 'login.html';

        // Cart Badge Logic
        fetch(`${window.CONFIG.BASE_URL}/get-cart`, {
            headers: { 'Authorization': `Bearer ${token}` }
        }).then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    const badge = document.getElementById('cartCountBadge');
                    badge.innerText = data.length;
                    badge.classList.remove('hidden');
                }
            }).catch(() => { });

        async function loadOrders() {
            try {
                const res = await fetch(`${window.CONFIG.BASE_URL}/get-orders`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error('Failed to load orders');

                const orders = await res.json();
                const container = document.getElementById('ordersContainer');

                if (orders.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-20 glass rounded-2xl border border-white/5">
                            <div class="w-20 h-20 rounded-full bg-white/5 flex items-center justify-center mx-auto mb-6"><i data-lucide="scroll" class="w-10 h-10 text-gray-500"></i></div>
                            <h2 class="text-xl text-gold-main font-cinzel mb-2">No Past Feasts</h2>
                            <p class="text-gray-400 font-sans text-sm mb-6 max-w-xs mx-auto">Your scroll is empty. Order freshly prepared meals to begin your story.</p>
                            <a href="menu.html" class="inline-block px-8 py-3 bg-gradient-to-r from-gold-matte to-gold-main text-black font-bold text-xs uppercase tracking-widest rounded-full hover:scale-105 transition-transform shadow-lg shadow-gold-main/20">Explore The Menu</a>
                        </div>
                    `;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                    return;
                }

                container.innerHTML = orders.reverse().map(order => `
                    <div class="glass p-6 md:p-8 rounded-2xl flex flex-col md:flex-row justify-between md:items-start gap-6 hover:border-gold-main/30 transition-colors group">
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-3">
                                <span class="text-[10px] font-bold text-gold-main uppercase tracking-widest border border-gold-main/20 px-2 py-1 rounded">Order #${order.id}</span>
                                <span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${getStatusColor(order.status)} text-black shadow-sm">
                                    ${order.status}
                                </span>
                            </div>
                            <h3 class="font-cinzel text-xl text-white mb-2 group-hover:text-gold-main transition-colors">${new Date(order.orderDate).toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</h3>
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-gold-rose text-xs uppercase tracking-wide">Kitchen:</span>
                                <span class="text-gray-200 text-sm font-semibold">${order.chefName || 'Home Kitchen'}</span>
                            </div>
                            <p class="text-gray-400 text-xs italic border-l-2 border-white/10 pl-3 py-1">${formatItems(order.items)}</p>
                        </div>
                        <div class="text-right flex flex-col items-end justify-between self-stretch">
                             <div>
                                <div class="text-3xl font-cinzel text-gold-main">₹${order.amount || '0'}</div>
                                <div class="text-[9px] text-gray-500 uppercase tracking-widest mt-1">Paid via Razorpay</div>
                             </div>
                             <button class="mt-4 px-4 py-2 border border-white/10 rounded-full text-[10px] uppercase font-bold text-gray-400 hover:bg-white/5 hover:text-white transition-all">
                                Need Help?
                             </button>
                        </div>
                    </div>
                `).join('');

            } catch (e) {
                console.error(e);
                document.getElementById('ordersContainer').innerHTML = `
                    <div class="text-center text-red-300 py-10 bg-red-900/10 rounded-xl border border-red-500/20">
                        <p class="font-cinzel">Could not retrieve records.</p>
                        <button onclick="location.reload()" class="underline text-xs mt-2 text-red-200 hover:text-white">Retry</button>
                    </div>
                `;
            }
        }

        function formatItems(itemsString) {
            if (!itemsString) return 'Delicious Meal';
            // If itemsString is basically "3 items", return it. 
            // If it's complex, maybe truncate.
            return itemsString;
        }

        function getStatusColor(status) {
            switch (status?.toLowerCase()) {
                case 'delivered': return 'bg-green-400';
                case 'preparing': return 'bg-amber-400';
                case 'placed': return 'bg-blue-400';
                case 'cancelled': return 'bg-red-400';
                default: return 'bg-gray-400';
            }
        }

        loadOrders();
    </script>

    <!-- Initialize Lucide Icons -->
    <script>if (typeof lucide !== 'undefined') lucide.createIcons();</script>
</body>

</html>
