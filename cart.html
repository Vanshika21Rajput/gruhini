<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart – Gruhani</title>
  <link rel="preload" href="public/background.jpg" as="image" type="image/jpeg">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="js/config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: { main: '#c5a059', matte: '#8c6a38', rose: '#e2b091' },
            royal: { dark: '#0f0805', brown: '#1a0f0a' }
          },
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            sans: ['Lato', 'sans-serif'],
            hindi: ['Noto Sans Devanagari', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body {
      background-color: #0f0805;
      color: #fff;
      font-family: 'Lato', sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::selection { background: rgba(212,175,55,0.3); color: #FDF8F0; }
    h1, h2, h3 { font-family: 'Cinzel', serif; line-height: 1.2; }
    .hero-bg {
      position: fixed; inset: 0; z-index: -1;
      background: url('public/background.jpg') center/cover no-repeat;
      opacity: 0.35;
    }
    .hero-overlay {
      position: fixed; inset: 0; z-index: -1;
      background: linear-gradient(to bottom, rgba(5,2,1,0.4), #0f0805);
    }
    .glass {
      background: rgba(15,8,5,0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(197,160,89,0.15);
    }
    .nav-glass {
      background: rgba(5,2,1,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(197,160,89,0.2);
    }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .custom-scroll::-webkit-scrollbar-thumb { background: #8c6a38; border-radius: 4px; }

    /* ── Address Modal ── */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: #1a0f0a;
      border: 1px solid rgba(197,160,89,0.3);
      border-radius: 1.5rem;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .addr-card {
      border: 1px solid rgba(197,160,89,0.2);
      border-radius: 0.75rem;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 0.75rem;
      background: rgba(255,255,255,0.03);
    }
    .addr-card:hover { border-color: rgba(197,160,89,0.6); background: rgba(197,160,89,0.06); }
    .addr-card.selected { border-color: #c5a059; background: rgba(197,160,89,0.12); }
    .addr-card input[type="radio"] { accent-color: #c5a059; }
    .field-input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(197,160,89,0.25);
      border-radius: 0.5rem;
      color: #fff;
      padding: 0.6rem 0.9rem;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .field-input:focus { border-color: #c5a059; }
    .field-input::placeholder { color: rgba(255,255,255,0.3); }
  </style>
</head>
<body class="min-h-screen pb-20">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>

  <nav class="fixed top-0 w-full z-40 px-6 py-4 flex justify-between items-center nav-glass transition-all duration-300">
    <a href="index.html" class="flex items-center gap-3 group">
      <div class="w-10 h-10 rounded-full overflow-hidden relative shadow-[0_0_15px_rgba(197,160,89,0.4)] group-hover:shadow-[0_0_25px_rgba(197,160,89,0.6)] transition-all duration-500 border border-gold-main/30">
        <img src="public/logo.jpg" alt="gruhani" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700">
      </div>
      <span class="font-cinzel text-xl font-bold text-gold-main tracking-widest drop-shadow-md group-hover:text-white transition-colors">gruhani</span>
    </a>
    <div class="flex items-center gap-6">
      <a href="menu.html" class="text-xs font-bold text-gold-main/80 hover:text-white uppercase tracking-widest transition-colors">Back to Menu</a>
    </div>
  </nav>

  <div class="pt-32 px-6 max-w-6xl mx-auto flex flex-col lg:flex-row gap-8 items-start">

    <!-- Cart Items Panel -->
    <div class="w-full lg:w-2/3 glass rounded-3xl p-6 md:p-8">
      <h1 class="font-cinzel text-3xl text-gold-main mb-6 flex items-center gap-3">
        <i data-lucide="shopping-bag" class="w-7 h-7"></i> Your Cart
        <span id="itemCount" class="text-sm font-sans text-gray-400 bg-white/5 px-3 py-1 rounded-full uppercase tracking-widest font-bold">0 Items</span>
      </h1>
      <div id="cartItems" class="space-y-6 max-h-[60vh] overflow-y-auto pr-2 custom-scroll">
        <div class="text-center py-20 text-gray-500 animate-pulse">Loading cart...</div>
      </div>
    </div>

    <!-- Order Summary Panel -->
    <div class="w-full lg:w-1/3 glass rounded-3xl p-8 sticky top-32">
      <h2 class="font-cinzel text-xl text-white mb-6 border-b border-gold-main/30 pb-4">Order Summary</h2>
      <div class="space-y-4 text-sm text-gray-300 mb-8">
        <div class="flex justify-between">
          <span>Subtotal</span>
          <span id="subtotal" class="font-bold text-white">₹0</span>
        </div>
        <div class="flex justify-between">
          <span>Delivery (Standard)</span>
          <span class="text-green-400 font-bold">FREE</span>
        </div>
        <div class="border-t border-white/10 pt-4 mt-4 flex justify-between items-center">
          <span class="font-cinzel text-lg text-gold-main font-bold">Total</span>
          <span id="total" class="font-cinzel text-2xl text-gold-main font-bold">₹0</span>
        </div>
      </div>

      <button id="checkoutBtn" onclick="openAddressModal()"
        class="w-full py-4 bg-gradient-to-r from-gold-matte to-gold-main text-black font-cinzel font-bold text-lg uppercase tracking-widest rounded-xl hover:scale-[1.02] transform transition-all shadow-[0_0_20px_rgba(197,160,89,0.3)] disabled:opacity-50 disabled:cursor-not-allowed">
        Place Order
      </button>

      <p class="text-xs text-center text-gray-500 mt-4 italic flex items-center justify-center gap-1">
        <i data-lucide="truck" class="w-3 h-3"></i> Cash on Delivery available
      </p>
    </div>

  </div>

  <!-- ════════════════════════════════════
       ADDRESS SELECTION MODAL
       Fix #1: no more hardcoded addressId
  ════════════════════════════════════ -->
  <div class="modal-backdrop" id="addressModal">
    <div class="modal-box">
      <div class="flex items-center justify-between mb-5">
        <h2 class="font-cinzel text-xl text-gold-main">Delivery Address</h2>
        <button onclick="closeAddressModal()" class="text-gray-400 hover:text-white transition-colors text-lg">✕</button>
      </div>

      <!-- Saved addresses list (populated dynamically) -->
      <div id="savedAddressList"></div>

      <!-- Manual entry — shown when no saved address or user picks "new" -->
      <div id="manualAddressSection">
        <p class="text-xs text-gray-400 uppercase tracking-widest mb-3 font-bold" id="manualLabel">Or enter a new address</p>
        <div class="space-y-3">
          <input id="addrLine1" class="field-input" placeholder="House / Flat No., Street *" required>
          <input id="addrCity"  class="field-input" placeholder="City *" required>
          <input id="addrState" class="field-input" placeholder="State *" required>
          <input id="addrPin"   class="field-input" placeholder="Pincode *" required maxlength="6" inputmode="numeric">
          <input id="addrPhone" class="field-input" placeholder="Contact number *" required inputmode="tel">
        </div>
      </div>

      <div id="addrError" class="text-red-400 text-xs mt-3 hidden"></div>

      <button onclick="confirmAndPlaceOrder()"
        class="w-full mt-6 py-3 bg-gradient-to-r from-gold-matte to-gold-main text-black font-cinzel font-bold uppercase tracking-widest rounded-xl hover:scale-[1.02] transform transition-all">
        Confirm &amp; Place Order
      </button>
    </div>
  </div>

  <script>
  let cartData = [];
  const token = localStorage.getItem('authToken');
  window.cartTotal = 0;

  // Saved addresses fetched from backend
  let savedAddresses = [];
  let selectedAddressId = null;

  if (!token) {
    window.location.href = 'login.html';
  } else {
    fetchCart();
  }

  /* ── CART FETCH ── */
  async function fetchCart() {
    try {
      const res = await fetch(`${window.CONFIG.BASE_URL}/get-cart`, {
        method: 'GET',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
      });
      if (!res.ok) throw new Error('Failed to load cart');
      const rawData = await res.json();
      console.log('📦 Cart response:', rawData);

      if (Array.isArray(rawData))          cartData = rawData;
      else if (rawData.cartItems)          cartData = rawData.cartItems;
      else if (rawData.items)              cartData = rawData.items;
      else if (rawData.product)            cartData = [rawData];
      else                                 cartData = [];

      renderCart();
    } catch (e) {
      console.error(e);
      document.getElementById('cartItems').innerHTML = `
        <div class="text-center py-10 text-red-400">
          Could not load cart.<br>
          <button onclick="location.reload()" class="underline mt-2">Retry</button>
        </div>`;
    }
  }

  /* ── RENDER CART ── */
  function renderCart() {
    const container   = document.getElementById('cartItems');
    const itemCountEl = document.getElementById('itemCount');
    const subtotalEl  = document.getElementById('subtotal');
    const totalEl     = document.getElementById('total');
    const checkoutBtn = document.getElementById('checkoutBtn');

    if (!cartData || cartData.length === 0) {
      container.innerHTML = `
        <div class="text-center py-10 text-gray-400 flex flex-col items-center">
          <div class="w-20 h-20 rounded-full bg-white/5 flex items-center justify-center mb-4">
            <i data-lucide="shopping-bag" class="w-10 h-10 text-gray-500"></i>
          </div>
          <p class="font-cinzel text-lg mb-4">Your cart is empty.</p>
          <a href="menu.html" class="px-6 py-2 border border-gold-main text-gold-main hover:bg-gold-main hover:text-black transition-all rounded-full text-xs uppercase font-bold tracking-widest">Browse Menu</a>
        </div>`;
      itemCountEl.innerText = '0 ITEMS';
      subtotalEl.innerText  = '₹0';
      totalEl.innerText     = '₹0';
      checkoutBtn.disabled  = true;
      window.cartTotal      = 0;
      if (typeof lucide !== 'undefined') lucide.createIcons();
      return;
    }

    let total = 0;
    container.innerHTML = cartData.map(item => {
      const product = item.product || item.p || item;
      const name  = product.productname || product.name  || item.productname || 'Unknown Item';
      const chef  = product.chefname    || product.chef  || item.chefname    || 'Home Chef';
      const price = parseFloat(product.price || item.price || 0);
      const img   = product.image || product.img || item.image || 'public/placeholder.jpg';
      const id    = product.productid || product.id || item.productid || item.id;
      const qty   = item.quantity || 1;
      total += price * qty;
      return `
        <div class="flex items-center gap-4 p-4 bg-white/5 rounded-xl border border-white/5 hover:border-gold-main/20 transition-colors group">
          <img src="${img}" class="w-20 h-20 rounded-lg object-cover bg-black/50">
          <div class="flex-1">
            <h3 class="font-cinzel text-lg text-white group-hover:text-gold-main transition-colors">${name}</h3>
            <p class="text-xs text-gray-400 uppercase tracking-widest mb-1">By ${chef}</p>
            <div class="font-bold text-gold-main">₹${price}${qty > 1 ? ` × ${qty}` : ''}</div>
          </div>
          <button onclick="removeItem('${id}')" class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center text-gray-500 hover:text-red-400 hover:border-red-400/50 hover:bg-red-400/10 transition-all">✕</button>
        </div>`;
    }).join('');

    itemCountEl.innerText = `${cartData.length} ITEMS`;
    const formatted = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0 }).format(total);
    subtotalEl.innerText = formatted;
    totalEl.innerText    = formatted;
    checkoutBtn.disabled = false;
    window.cartTotal     = total;
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  /* ── FIX #2: removeItem — tries DELETE first, falls back to POST ── */
  async function removeItem(id) {
    if (!confirm('Remove this item?')) return;
    const originalData = [...cartData];
    cartData = cartData.filter(i => {
      const pId = i.product?.id || i.p?.id || i.productid || i.id;
      return String(pId) !== String(id);
    });
    renderCart();
    try {
      // Try DELETE first (RESTful standard)
      let res = await fetch(`${window.CONFIG.BASE_URL}/remove-from-cart/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
      });
      // If backend doesn't support DELETE, fall back to POST
      if (res.status === 405) {
        res = await fetch(`${window.CONFIG.BASE_URL}/remove-from-cart/${id}`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
        });
      }
      if (!res.ok) throw new Error(`Remove failed: ${res.status}`);
      fetchCart(); // re-sync with server
    } catch (e) {
      console.error('Remove error:', e);
      cartData = originalData;
      renderCart();
    }
  }

  /* ── FIX #1: ADDRESS MODAL ── */
  async function openAddressModal() {
    document.getElementById('addressModal').classList.add('open');
    document.getElementById('addrError').classList.add('hidden');
    await loadSavedAddresses();
  }

  function closeAddressModal() {
    document.getElementById('addressModal').classList.remove('open');
  }

  async function loadSavedAddresses() {
    const listEl = document.getElementById('savedAddressList');
    listEl.innerHTML = `<p class="text-xs text-gray-400 animate-pulse mb-3">Loading saved addresses...</p>`;
    try {
      const res = await fetch(`${window.CONFIG.BASE_URL}/get-addresses`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('No address endpoint');
      const data = await res.json();
      savedAddresses = Array.isArray(data) ? data : (data.addresses || data.data || []);
    } catch {
      savedAddresses = [];
    }

    if (savedAddresses.length === 0) {
      listEl.innerHTML = '';
      document.getElementById('manualLabel').innerText = 'Enter your delivery address';
      return;
    }

    // Show saved addresses as radio cards
    document.getElementById('manualLabel').innerText = 'Or enter a new address';
    listEl.innerHTML = `<p class="text-xs text-gray-400 uppercase tracking-widest mb-3 font-bold">Saved Addresses</p>`;
    savedAddresses.forEach((addr, idx) => {
      const id    = addr.id || addr.addressId || idx;
      const line1 = addr.line1 || addr.street || addr.address || '';
      const city  = addr.city  || '';
      const state = addr.state || '';
      const pin   = addr.pincode || addr.pin || '';
      const card  = document.createElement('div');
      card.className = 'addr-card' + (idx === 0 ? ' selected' : '');
      card.innerHTML = `
        <label class="flex items-start gap-3 cursor-pointer w-full">
          <input type="radio" name="savedAddr" value="${id}" ${idx === 0 ? 'checked' : ''} class="mt-1 flex-shrink-0">
          <div>
            <p class="text-sm text-white font-semibold">${line1}</p>
            <p class="text-xs text-gray-400">${[city, state, pin].filter(Boolean).join(', ')}</p>
          </div>
        </label>`;
      card.querySelector('input').addEventListener('change', () => {
        document.querySelectorAll('.addr-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedAddressId = id;
      });
      listEl.appendChild(card);
    });

    // Pre-select first
    selectedAddressId = savedAddresses[0]?.id || savedAddresses[0]?.addressId || 0;
  }

  /* ── Validate manual address fields ── */
  function getManualAddress() {
    const line1 = document.getElementById('addrLine1').value.trim();
    const city  = document.getElementById('addrCity').value.trim();
    const state = document.getElementById('addrState').value.trim();
    const pin   = document.getElementById('addrPin').value.trim();
    const phone = document.getElementById('addrPhone').value.trim();
    return { line1, city, state, pin, phone };
  }

  function showAddrError(msg) {
    const el = document.getElementById('addrError');
    el.innerText = msg;
    el.classList.remove('hidden');
  }

  /* ── FIX #1 + FIX #4: confirmAndPlaceOrder ── */
  async function confirmAndPlaceOrder() {
    document.getElementById('addrError').classList.add('hidden');

    // Build request body — prefer saved address id, else use manual fields
    let body = {};
    const radioChecked = document.querySelector('input[name="savedAddr"]:checked');
    if (radioChecked) {
      // User picked a saved address
      body = { addressId: parseInt(radioChecked.value) };
    } else {
      // Manual address entry
      const { line1, city, state, pin, phone } = getManualAddress();
      if (!line1 || !city || !state || !pin || !phone) {
        showAddrError('Please fill all address fields marked with *');
        return;
      }
      if (!/^\d{6}$/.test(pin)) {
        showAddrError('Pincode must be 6 digits.');
        return;
      }
      // Send address details — backend may accept either addressId or address object
      // If backend only accepts addressId, a prior POST to /save-address would be needed
      body = { address: { line1, city, state, pincode: pin, phone } };
    }

    closeAddressModal();
    await placeOrder(body);
  }

  /* ── FIX #4: placeOrder with safe orderId extraction ── */
  async function placeOrder(body) {
    const btn = document.getElementById('checkoutBtn');
    btn.innerHTML = `<span class="animate-pulse">Placing Order...</span>`;
    btn.disabled = true;

    try {
      const res = await fetch(`${window.CONFIG.BASE_URL}/place-order`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(errText || `Server error ${res.status}`);
      }

      const data = await res.json();
      console.log('✅ Place order response:', data);

      // FIX #4 — try every possible orderId field name the backend might use
      const orderId =
        data.id         ||
        data.orderId    ||
        data.order_id   ||
        data.orderID    ||
        data.OrderId    ||
        (data.order && (data.order.id || data.order.orderId)) ||
        null;

      if (!orderId) {
        // Response came back OK but no ID found — log it so Vanshika can add the field
        console.error('❌ Order placed but no orderId in response:', data);
        throw new Error('Order placed but no Order ID returned. Please check your orders page.');
      }

      window.location.href = `order-status.html?orderId=${orderId}`;

    } catch (e) {
      console.error('Checkout error:', e);
      alert(e.message || 'Order failed. Please try again.');
      btn.innerHTML = 'Place Order';
      btn.disabled  = false;
    }
  }
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>
</body>
</html>
