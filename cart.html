<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart – Gruhani</title>
  <link rel="preload" href="public/background.jpg" as="image" type="image/jpeg">
  <script src="js/config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: { main: '#c5a059', matte: '#8c6a38', rose: '#e2b091' },
            royal: { dark: '#0f0805', brown: '#1a0f0a' }
          },
          fontFamily: { cinzel: ['Cinzel', 'serif'], sans: ['Lato', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body { background-color: #0f0805; color: #fff; font-family: 'Lato', sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    ::selection { background: rgba(212,175,55,0.3); color: #FDF8F0; }
    h1, h2, h3 { font-family: 'Cinzel', serif; line-height: 1.2; }
    .hero-bg { position: fixed; inset: 0; z-index: -1; background: url('public/background.jpg') center/cover no-repeat; opacity: 0.35; }
    .hero-overlay { position: fixed; inset: 0; z-index: -1; background: linear-gradient(to bottom, rgba(5,2,1,0.4), #0f0805); }
    .glass { background: rgba(15,8,5,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(197,160,89,0.15); }
    .nav-glass { background: rgba(5,2,1,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(197,160,89,0.2); }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .custom-scroll::-webkit-scrollbar-thumb { background: #8c6a38; border-radius: 4px; }
    .qty-btn { width:28px; height:28px; border-radius:50%; border:1px solid rgba(197,160,89,0.4); background:rgba(197,160,89,0.08); color:#c5a059; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; flex-shrink:0; }
    .qty-btn:hover { background:rgba(197,160,89,0.25); border-color:#c5a059; }
    .qty-btn:active { transform:scale(0.9); }
    .qty-display { min-width:28px; text-align:center; font-weight:700; color:#fff; font-size:0.95rem; }
    .modal-backdrop { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.75); backdrop-filter:blur(4px); align-items:center; justify-content:center; }
    .modal-backdrop.open { display:flex; }
    .modal-box { background:#1a0f0a; border:1px solid rgba(197,160,89,0.3); border-radius:1.5rem; padding:2rem; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; }
    .modal-box::-webkit-scrollbar { width:5px; }
    .modal-box::-webkit-scrollbar-thumb { background:#8c6a38; border-radius:4px; }
    .addr-card { border:1px solid rgba(197,160,89,0.2); border-radius:0.75rem; padding:1rem; cursor:pointer; margin-bottom:0.75rem; background:rgba(255,255,255,0.03); transition:all 0.2s; }
    .addr-card:hover { border-color:rgba(197,160,89,0.5); background:rgba(197,160,89,0.06); }
    .addr-card.selected { border-color:#c5a059; background:rgba(197,160,89,0.1); }
    .field-label { display:block; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em; font-weight:700; color:rgba(197,160,89,0.7); margin-bottom:0.35rem; }
    .field-input { width:100%; background:rgba(255,255,255,0.05); border:1px solid rgba(197,160,89,0.25); border-radius:0.5rem; color:#fff; padding:0.65rem 0.9rem; font-size:0.875rem; outline:none; transition:border-color 0.2s; box-sizing:border-box; appearance:none; }
    .field-input:focus { border-color:#c5a059; box-shadow:0 0 0 2px rgba(197,160,89,0.1); }
    .field-input::placeholder { color:rgba(255,255,255,0.3); }
    select.field-input option { background:#1a0f0a; color:#fff; }
    .pin-status { font-size:0.75rem; margin-top:0.4rem; min-height:1.1rem; display:flex; align-items:center; gap:0.4rem; }
    .pin-status.success { color:#4ade80; }
    .pin-status.error   { color:#f87171; }
    .pin-status.loading { color:#c5a059; }
    #editSection { display:none; }
    #editSection.open { display:block; }
  </style>
</head>
<body class="min-h-screen pb-20">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>

  <nav class="fixed top-0 w-full z-40 px-6 py-4 flex justify-between items-center nav-glass">
    <a href="index.html" class="flex items-center gap-3 group">
      <div class="w-10 h-10 rounded-full overflow-hidden border border-gold-main/30 shadow-[0_0_15px_rgba(197,160,89,0.4)] group-hover:shadow-[0_0_25px_rgba(197,160,89,0.6)] transition-all duration-500">
        <img src="public/logo.jpg" alt="gruhani" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
      </div>
      <span class="font-cinzel text-xl font-bold text-gold-main tracking-widest group-hover:text-white transition-colors">gruhani</span>
    </a>
    <a href="menu.html" class="text-xs font-bold text-gold-main/80 hover:text-white uppercase tracking-widest transition-colors">Back to Menu</a>
  </nav>

  <div class="pt-32 px-6 max-w-6xl mx-auto flex flex-col lg:flex-row gap-8 items-start">
    <div class="w-full lg:w-2/3 glass rounded-3xl p-6 md:p-8">
      <h1 class="font-cinzel text-3xl text-gold-main mb-6 flex items-center gap-3">
        <i data-lucide="shopping-bag" class="w-7 h-7"></i> Your Cart
        <span id="itemCount" class="text-sm font-sans text-gray-400 bg-white/5 px-3 py-1 rounded-full uppercase tracking-widest font-bold">0 Items</span>
      </h1>
      <div id="cartItems" class="space-y-4 max-h-[60vh] overflow-y-auto pr-2 custom-scroll">
        <div class="text-center py-20 text-gray-500 animate-pulse">Loading cart...</div>
      </div>
    </div>

    <div class="w-full lg:w-1/3 glass rounded-3xl p-8 sticky top-32">
      <h2 class="font-cinzel text-xl text-white mb-6 border-b border-gold-main/30 pb-4">Order Summary</h2>
      <div class="space-y-4 text-sm text-gray-300 mb-8">
        <div class="flex justify-between"><span>Subtotal</span><span id="subtotal" class="font-bold text-white">₹0</span></div>
        <div id="itemBreakdown" class="space-y-1 text-xs text-gray-500"></div>
        <div class="flex justify-between"><span>Delivery</span><span class="text-green-400 font-bold">FREE</span></div>
        <div class="border-t border-white/10 pt-4 flex justify-between items-center">
          <span class="font-cinzel text-lg text-gold-main font-bold">Total</span>
          <span id="total" class="font-cinzel text-2xl text-gold-main font-bold">₹0</span>
        </div>
      </div>
      <button id="checkoutBtn" onclick="openAddressModal()"
        class="w-full py-4 bg-gradient-to-r from-gold-matte to-gold-main text-black font-cinzel font-bold text-lg uppercase tracking-widest rounded-xl hover:scale-[1.02] transition-all shadow-[0_0_20px_rgba(197,160,89,0.3)] disabled:opacity-50 disabled:cursor-not-allowed">
        Place Order
      </button>
      <p class="text-xs text-center text-gray-500 mt-4 italic flex items-center justify-center gap-1">
        <i data-lucide="truck" class="w-3 h-3"></i> Cash on Delivery available
      </p>
    </div>
  </div>

  <!-- ADDRESS MODAL -->
  <div class="modal-backdrop" id="addressModal">
    <div class="modal-box">
      <div class="flex items-center justify-between mb-5">
        <h2 class="font-cinzel text-xl text-gold-main flex items-center gap-2">
          <i data-lucide="map-pin" class="w-5 h-5"></i> Delivery Address
        </h2>
        <button onclick="closeAddressModal()" class="text-gray-400 hover:text-white text-xl leading-none">✕</button>
      </div>

      <div id="addrLoading" class="text-center py-6 text-sm text-gray-400 animate-pulse">Loading your address...</div>
      <div id="addrDisplay" class="hidden"></div>

      <div id="editSection">
        <p class="text-xs text-gray-400 uppercase tracking-widest font-bold mb-4" id="editLabel">Edit Address</p>
        <div class="flex items-center gap-2 bg-white/5 border border-gold-main/20 rounded-lg px-3 py-2.5 mb-4">
          <span>🇮🇳</span><span class="text-sm text-gold-main font-bold">India</span>
          <span class="text-xs text-gray-500 ml-auto">Country (fixed)</span>
        </div>
        <div class="space-y-3">
          <div>
            <label class="field-label" for="addrPin">Pincode *</label>
            <input id="addrPin" class="field-input" placeholder="6-digit pincode" maxlength="6" inputmode="numeric" oninput="onPincodeInput(this.value)">
            <div class="pin-status" id="pinStatus"></div>
          </div>
          <div>
            <label class="field-label" for="addrState">State *</label>
            <select id="addrState" class="field-input">
              <option value="">— Select State —</option>
              <option>Andhra Pradesh</option><option>Arunachal Pradesh</option><option>Assam</option>
              <option>Bihar</option><option>Chhattisgarh</option><option>Goa</option>
              <option>Gujarat</option><option>Haryana</option><option>Himachal Pradesh</option>
              <option>Jharkhand</option><option>Karnataka</option><option>Kerala</option>
              <option>Madhya Pradesh</option><option>Maharashtra</option><option>Manipur</option>
              <option>Meghalaya</option><option>Mizoram</option><option>Nagaland</option>
              <option>Odisha</option><option>Punjab</option><option>Rajasthan</option>
              <option>Sikkim</option><option>Tamil Nadu</option><option>Telangana</option>
              <option>Tripura</option><option>Uttar Pradesh</option><option>Uttarakhand</option>
              <option>West Bengal</option><option>Andaman &amp; Nicobar Islands</option>
              <option>Chandigarh</option><option>Dadra &amp; Nagar Haveli and Daman &amp; Diu</option>
              <option>Delhi (NCT)</option><option>Jammu &amp; Kashmir</option>
              <option>Ladakh</option><option>Lakshadweep</option><option>Puducherry</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="addrCity">District / City *</label>
            <input id="addrCity" class="field-input" placeholder="Auto-filled from pincode, or type">
          </div>
          <div>
            <label class="field-label" for="addrLine">House / Flat, Street *</label>
            <input id="addrLine" class="field-input" placeholder="e.g. Flat 4B, Shanti Nagar, MG Road">
          </div>
        </div>
      </div>

      <div id="addrError" class="hidden text-red-400 text-xs mt-3 flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-3 h-3 flex-shrink-0"></i>
        <span id="addrErrorText"></span>
      </div>
      <div class="flex gap-3 mt-6" id="addrActions"></div>
    </div>
  </div>

  <script>
  let cartData = [];
  const token = localStorage.getItem('authToken');
  window.cartTotal = 0;
  let pincodeTimer = null;
  let savedAddressId = 0;
  // FIX 1: was 0, now null so falsy check works correctly in proceedWithSelected
  let selectedAddressId = null;
  let orderInProgress = false;

  if (!token) { window.location.href = 'login.html'; }
  else { fetchCart(); }

  async function fetchCart() {
    try {
      const res = await fetch(`${window.CONFIG.BASE_URL}/get-cart`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error();
      const raw = await res.json();
      cartData = Array.isArray(raw) ? raw : (raw.cartItems || raw.items || (raw.product ? [raw] : []));
      renderCart();
    } catch {
      document.getElementById('cartItems').innerHTML =
        `<div class="text-center py-10 text-red-400">Could not load cart. <button onclick="location.reload()" class="underline mt-2">Retry</button></div>`;
    }
  }

  function renderCart() {
    const container = document.getElementById('cartItems');
    const fmt = v => new Intl.NumberFormat('en-IN', { style:'currency', currency:'INR', minimumFractionDigits:0 }).format(v);

    if (!cartData || cartData.length === 0) {
      container.innerHTML = `<div class="text-center py-10 text-gray-400 flex flex-col items-center">
        <div class="w-20 h-20 rounded-full bg-white/5 flex items-center justify-center mb-4">
          <i data-lucide="shopping-bag" class="w-10 h-10 text-gray-500"></i></div>
        <p class="font-cinzel text-lg mb-4">Your cart is empty.</p>
        <a href="menu.html" class="px-6 py-2 border border-gold-main text-gold-main hover:bg-gold-main hover:text-black transition-all rounded-full text-xs uppercase font-bold tracking-widest">Browse Menu</a></div>`;
      document.getElementById('itemCount').innerText = '0 ITEMS';
      document.getElementById('subtotal').innerText  = '₹0';
      document.getElementById('total').innerText     = '₹0';
      document.getElementById('itemBreakdown').innerHTML = '';
      document.getElementById('checkoutBtn').disabled = true;
      window.cartTotal = 0;
      if (typeof lucide !== 'undefined') lucide.createIcons();
      return;
    }

    let total = 0, bHtml = '';
    container.innerHTML = cartData.map(item => {
      const p     = item.product || item.p || item;
      const name  = p.productname || p.name  || item.productname || 'Unknown Item';
      const chef  = p.chefname   || p.chef   || item.chefname    || 'Home Chef';
      const price = parseFloat(p.price || item.price || 0);
      const img   = p.image || p.img || item.image || 'https://placehold.co/150x150/1a0f0a/c5a059?text=Food';
      const id    = p.productid || p.id || item.productid || item.id;
      const qty   = parseInt(item.quantity) || 1;
      const line  = price * qty;
      total += line;
      bHtml += `<div class="flex justify-between"><span class="truncate max-w-[140px]">${name} ×${qty}</span><span>${fmt(line)}</span></div>`;
      return `
        <div class="flex items-center gap-4 p-4 bg-white/5 rounded-xl border border-white/5 hover:border-gold-main/20 transition-colors group">
          <img src="${img}" class="w-16 h-16 rounded-lg object-cover bg-black/50 flex-shrink-0" onerror="this.src='https://placehold.co/150x150/1a0f0a/c5a059?text=Food'">
          <div class="flex-1 min-w-0">
            <h3 class="font-cinzel text-base text-white group-hover:text-gold-main transition-colors truncate">${name}</h3>
            <p class="text-xs text-gray-400 uppercase tracking-widest mb-2">By ${chef}</p>
            <div class="flex items-center gap-3">
              <button onclick="changeQty('${id}',${qty-1})" class="qty-btn">−</button>
              <span class="qty-display">${qty}</span>
              <button onclick="changeQty('${id}',${qty+1})" class="qty-btn">+</button>
              <span class="text-gold-main font-bold text-sm ml-2">${fmt(line)}</span>
            </div>
          </div>
          <button onclick="removeItem('${id}')" class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center text-gray-500 hover:text-red-400 hover:border-red-400/50 hover:bg-red-400/10 transition-all flex-shrink-0">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        </div>`;
    }).join('');

    document.getElementById('itemCount').innerText     = `${cartData.length} ITEM${cartData.length !== 1 ? 'S' : ''}`;
    document.getElementById('subtotal').innerText      = fmt(total);
    document.getElementById('total').innerText         = fmt(total);
    document.getElementById('itemBreakdown').innerHTML = cartData.length > 1 ? bHtml : '';
    document.getElementById('checkoutBtn').disabled    = false;
    window.cartTotal = total;
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  function changeQty(id, newQty) {
    if (newQty < 1) { if (confirm('Remove this item from cart?')) removeItem(id); return; }
    const item = cartData.find(i => String(i.productid || i.product?.id || i.id) === String(id));
    if (item) { item.quantity = newQty; renderCart(); }
    fetch(`${window.CONFIG.BASE_URL}/update-quantity`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ productid: parseInt(id, 10), quantity: newQty })
    }).catch(() => {});
  }

  async function removeItem(id) {
    if (!confirm('Remove this item?')) return;
    const orig = [...cartData];
    cartData = cartData.filter(i => String(i.productid || i.product?.id || i.id) !== String(id));
    renderCart();
    try {
      let res = await fetch(`${window.CONFIG.BASE_URL}/remove-from-cart/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
      if (res.status === 405) res = await fetch(`${window.CONFIG.BASE_URL}/remove-from-cart/${id}`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
      if (!res.ok) throw new Error();
      fetchCart();
    } catch { cartData = orig; renderCart(); }
  }

  async function openAddressModal() {
    document.getElementById('addressModal').classList.add('open');
    document.getElementById('addrLoading').classList.remove('hidden');
    document.getElementById('addrDisplay').classList.add('hidden');
    document.getElementById('editSection').classList.remove('open');
    document.getElementById('addrActions').innerHTML = '';
    hideAddrError();

    try {
      const res = await fetch(`${window.CONFIG.BASE_URL}/view-profile`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error();
      const profile = await res.json();
      document.getElementById('addrLoading').classList.add('hidden');
      renderAddressCards(profile.addresses || []);
    } catch {
      document.getElementById('addrLoading').classList.add('hidden');
      openEditForm(null, true);
    }
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  function closeAddressModal() { document.getElementById('addressModal').classList.remove('open'); }

  function renderAddressCards(addresses) {
    const displayEl = document.getElementById('addrDisplay');
    displayEl.classList.remove('hidden');
    if (addresses.length === 0) { openEditForm(null, true); return; }

    // FIX 1: store first address id properly
    selectedAddressId = addresses[0].id || null;

    // FIX 2: store cache BEFORE building innerHTML so onclick can reference it
    window.addresses_cache = addresses;

    displayEl.innerHTML = `
      <p class="text-xs text-gray-400 uppercase tracking-widest font-bold mb-3">Your Saved Address</p>
      ${addresses.map((addr, idx) => `
        <div class="addr-card ${idx === 0 ? 'selected' : ''}" id="addrCard_${idx}"
          onclick="selectCard(${addr.id || idx}, ${idx}, ${addresses.length})">
          <div class="flex items-start gap-3">
            <input type="radio" name="addrRadio" value="${addr.id}" ${idx === 0 ? 'checked' : ''}
              style="accent-color:#c5a059;margin-top:3px;flex-shrink:0;">
            <div class="flex-1 min-w-0">
              <p class="text-sm text-white font-semibold truncate">${addr.addressLine || '—'}</p>
              <p class="text-xs text-gray-400 mt-0.5">${[addr.city, addr.state, addr.pincode].filter(Boolean).join(', ')}</p>
            </div>
            <!-- FIX 2: use openEditFormFromData(idx) — no second arg, uses window.addresses_cache -->
            <button onclick="event.stopPropagation(); openEditFormFromData(${idx})"
              class="text-gold-main/60 hover:text-gold-main text-xs underline whitespace-nowrap flex-shrink-0 ml-2 transition-colors">Edit</button>
          </div>
        </div>`).join('')}
      <button onclick="openEditForm(null, true)"
        class="w-full mt-1 py-2.5 border border-dashed border-gold-main/30 hover:border-gold-main/60 rounded-xl text-xs text-gray-400 hover:text-gold-main transition-all flex items-center justify-center gap-2">
        <i data-lucide="plus" class="w-3 h-3"></i> Add / use a different address
      </button>`;

    document.getElementById('addrActions').innerHTML = `
      <button onclick="proceedWithSelected()"
        class="flex-1 py-3 bg-gradient-to-r from-gold-matte to-gold-main text-black font-cinzel font-bold uppercase tracking-widest rounded-xl hover:scale-[1.02] transition-all text-sm">
        Confirm &amp; Place Order
      </button>`;
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  function selectCard(addrId, idx, total) {
    selectedAddressId = addrId;
    for (let i = 0; i < total; i++) {
      const c = document.getElementById(`addrCard_${i}`);
      if (c) c.classList.toggle('selected', i === idx);
    }
    const r = document.querySelector(`input[name="addrRadio"][value="${addrId}"]`);
    if (r) r.checked = true;
  }

  // FIX 2: removed second param — always reads from window.addresses_cache
  function openEditFormFromData(idx) { openEditForm(window.addresses_cache[idx], false); }

  function openEditForm(addr, isNew) {
    document.getElementById('editSection').classList.add('open');
    document.getElementById('editLabel').innerText = isNew ? 'Enter New Address' : 'Edit Your Address';

    if (addr && !isNew) {
      savedAddressId = addr.id || 0;
      document.getElementById('addrLine').value = addr.addressLine || '';
      document.getElementById('addrCity').value = addr.city        || '';
      document.getElementById('addrPin').value  = addr.pincode     || '';
      const sel = document.getElementById('addrState');
      for (let opt of sel.options) {
        if (opt.text.toLowerCase() === (addr.state || '').toLowerCase()) { sel.value = opt.value; break; }
      }
    } else {
      savedAddressId = 0;
      ['addrLine','addrCity','addrPin'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('addrState').value = '';
      document.getElementById('pinStatus').innerHTML = '';
      document.getElementById('pinStatus').className = 'pin-status';
    }

    document.getElementById('addrActions').innerHTML = `
      <button id="saveOrderBtn" onclick="saveAndPlaceOrder()"
        class="flex-1 py-3 bg-gradient-to-r from-gold-matte to-gold-main text-black font-cinzel font-bold uppercase tracking-widest rounded-xl hover:scale-[1.02] transition-all text-sm">
        Save &amp; Place Order
      </button>`;
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  function onPincodeInput(val) {
    const clean = val.replace(/\D/g, '');
    document.getElementById('addrPin').value = clean;
    clearTimeout(pincodeTimer);
    const s = document.getElementById('pinStatus');
    if (clean.length < 6) { s.className = 'pin-status'; s.innerHTML = ''; return; }
    s.className = 'pin-status loading'; s.innerHTML = '⏳ Verifying pincode...';
    pincodeTimer = setTimeout(() => validatePincode(clean), 600);
  }

  async function validatePincode(pin) {
    const s = document.getElementById('pinStatus');
    try {
      const data = await (await fetch(`https://api.postalpincode.in/pincode/${pin}`)).json();
      if (data[0].Status === 'Success' && data[0].PostOffice?.length > 0) {
        const po = data[0].PostOffice[0];
        const district = po.District || '', state = po.State || '';
        const cityEl = document.getElementById('addrCity');
        if (!cityEl.value) cityEl.value = district;
        const sel = document.getElementById('addrState');
        for (let opt of sel.options) {
          if (opt.text.toLowerCase().includes(state.toLowerCase()) ||
              state.toLowerCase().includes(opt.text.toLowerCase())) { sel.value = opt.value; break; }
        }
        s.className = 'pin-status success';
        s.innerHTML = `✓ <strong>${district}</strong>, ${state} · ${data[0].PostOffice.length} post office(s) found`;
      } else {
        s.className = 'pin-status error'; s.innerHTML = '✗ Invalid pincode';
      }
    } catch { s.className = 'pin-status error'; s.innerHTML = '⚠ Could not verify pincode'; }
  }

  async function proceedWithSelected() {
    // FIX 3: guard against null/0 selectedAddressId
    if (!selectedAddressId || Number(selectedAddressId) === 0) {
      showAddrError('Please select an address.');
      return;
    }
    closeAddressModal();
    await placeOrder({ addressId: parseInt(selectedAddressId) });
  }

  async function saveAndPlaceOrder() {
    hideAddrError();
    const addressLine = document.getElementById('addrLine').value.trim();
    const city        = document.getElementById('addrCity').value.trim();
    const state       = document.getElementById('addrState').value.trim();
    const pincode     = document.getElementById('addrPin').value.trim();

    if (!addressLine) { showAddrError('Please enter your house / street address.'); return; }
    if (!city)        { showAddrError('Please enter the district or city.'); return; }
    if (!state)       { showAddrError('Please select your state.'); return; }
    if (!/^\d{6}$/.test(pincode)) { showAddrError('Pincode must be exactly 6 digits.'); return; }

    const btn = document.getElementById('saveOrderBtn');
    if (btn) { btn.innerHTML = 'Saving...'; btn.disabled = true; }

    const addressDto = { id: savedAddressId, addressLine, city, state, pincode };
    console.log('📍 PATCH /add-address:', addressDto);

    try {
      const saveRes = await fetch(`${window.CONFIG.BASE_URL}/add-address`, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(addressDto)
      });
      if (!saveRes.ok) throw new Error(await saveRes.text() || `${saveRes.status}`);
    } catch(e) {
      showAddrError('Could not save address: ' + e.message);
      if (btn) { btn.innerHTML = 'Save &amp; Place Order'; btn.disabled = false; }
      return;
    }

    let addressId = savedAddressId;
    // FIX 4: always refetch after save to get the real DB id for new addresses
    if (!addressId || Number(addressId) === 0) {
      try {
        const profile = await (await fetch(`${window.CONFIG.BASE_URL}/view-profile`, {
          headers: { 'Authorization': `Bearer ${token}` }
        })).json();
        const addrs = profile.addresses || [];
        if (addrs.length > 0) addressId = addrs[addrs.length - 1].id || 0;
      } catch(e) { console.warn('Profile refetch failed:', e); }
    }

    // FIX 4: strict guard — do not proceed with 0 or falsy id
    if (!addressId || Number(addressId) === 0) {
      showAddrError('Address saved but ID not found. Please try again.');
      if (btn) { btn.innerHTML = 'Save &amp; Place Order'; btn.disabled = false; }
      return;
    }

    console.log('✅ addressId resolved:', addressId);
    closeAddressModal();
    await placeOrder({ addressId: parseInt(addressId) });
  }

  async function placeOrder(body) {
    if (orderInProgress) return;

    // FIX 5: final safety net — never send addressId 0 or null to backend
    if (!body.addressId || Number(body.addressId) === 0) {
      alert('No valid delivery address selected. Please try again.');
      return;
    }

    orderInProgress = true;

    const btn = document.getElementById('checkoutBtn');
    btn.innerHTML = `<span class="animate-pulse">Placing Order...</span>`;
    btn.disabled = true;

    console.log('🛒 POST /place-order:', JSON.stringify(body));
    try {
      const res = await fetch(`${window.CONFIG.BASE_URL}/place-order`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        let msg = `Error ${res.status}`;
        try { const j = await res.json(); msg = j.message || JSON.stringify(j); } catch { msg = await res.text() || msg; }
        throw new Error(msg);
      }
      const data = await res.json();
      console.log('✅ Order placed:', data);
      // FIX 6: orderId comes from backend as data.id (OrderSellerResponseDto)
      const orderId = data.id || data.orderId || data.order_id || (data.order?.id) || null;
      orderInProgress = false;
      // redirect to orders page — change to order-status.html if that page exists
      if (orderId) window.location.href = `orders-status.html`;
      else { alert('Order placed! 🎉'); window.location.href = 'orders.html'; }
    } catch(e) {
      console.error(e);
      alert('Order failed: ' + (e.message || 'Please try again.'));
      btn.innerHTML = 'Place Order';
      btn.disabled = false;
      orderInProgress = false;
    }
  }

  function showAddrError(msg) {
    document.getElementById('addrError').classList.remove('hidden');
    document.getElementById('addrErrorText').innerText = msg;
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }
  function hideAddrError() { document.getElementById('addrError').classList.add('hidden'); }
  </script>
  <script>document.addEventListener('DOMContentLoaded', () => { if (typeof lucide !== 'undefined') lucide.createIcons(); });</script>
</body>
</html>
