<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Order Placed!</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Lato&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body class="bg-[#FDF8F0] flex flex-col items-center justify-center min-h-screen text-center px-4">
    <div class="text-6xl mb-4">🎉</div>
    <h1 class="font-cinzel text-4xl text-[#d97706] mb-2">Order Confirmed!</h1>
    <p class="text-gray-600 font-sans mb-8">The kitchen has received your request.</p>
    <p class="text-xs text-gray-400 mb-8 uppercase tracking-widest">Order ID: <span id="oid"
            class="text-gray-800 font-bold">--</span></p>
    <a href="index.html"
        class="bg-[#d97706] text-white px-8 py-3 rounded-full font-bold uppercase tracking-widest shadow-lg">Back
        Home</a>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('oid').innerText = urlParams.get('oid') || "GEN-" + Math.floor(Math.random() * 10000);
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    </script>
</body>

</html>
